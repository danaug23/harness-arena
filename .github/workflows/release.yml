name: Release

# Publishes to PyPI through trusted publishing: GitHub mints a short-lived OIDC
# token for this exact workflow in this exact repository, PyPI verifies it, and
# nothing long-lived is stored anywhere. Registered at
# pypi.org/manage/account/publishing as repository danaug23/harness-arena,
# workflow release.yml. The filename is part of that contract: renaming this
# file breaks publishing until the publisher is updated to match.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: python -m pip install --upgrade pip && pip install -e . && pip install build twine

      # A tag can be pushed at any commit, so the tag is not evidence that the
      # tests passed. PyPI versions are permanent, so this is the last point at
      # which a broken artifact can still be stopped.
      - name: Test
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python tests/test_config.py
          python tests/test_api.py
          python tests/test_supervisor.py
          python tests/test_collect.py
          python tests/test_tokens.py
          python tests/test_local_agents.py
          node tests/test_dashboard.mjs

      # Publishing 0.1.0 from a tag reading v0.2.0 is silent and permanent: the
      # version on PyPI comes from pyproject, never from the tag.
      - name: Tag must match the project version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python -c "import bench;print(bench.__version__)")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject version $version."
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $version"

      - name: Build
        run: python -m build

      # Catches a long description PyPI would reject *after* the version number
      # has already been consumed.
      - name: Check the metadata renders
        run: python -m twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    # The only job that can mint the OIDC token, and it does nothing else.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
