          seenKinds.add(c.late ? "late" : c.near ? "near" : c.cls);
          const tipHtml = [
            `<div class="t-h">${esc(name)}</div>`,
            `<div class="t-r">${esc(r.harness_label)}: <b>${c.word}</b></div>`,
            c.late
              ? `<div class="t-r">tests passed, but the agent was killed at the
                 time limit — the verifier graded what was on disk</div>`
              : "",
            c.cls === "unscored"
              ? `<div class="t-r">the harness's HTTP client failed to send a
                 request. Its cause is not in the log — most harnesses record
                 only that sending failed. This does <b>not</b> establish that
                 the endpoint was down; enable <b>Capture diagnostics</b> on the
                 Run tab to sample the endpoint and settle it. Left out of the
                 pass rate rather than counted against the harness.</div>
                 ${t.endpoint_health && t.endpoint_health.n_samples
                   ? `<div class="t-r">watchdog around this moment:
                      <b>${t.endpoint_health.n_samples - t.endpoint_health.n_unreachable}
                      of ${t.endpoint_health.n_samples}</b> samples reachable${
                        t.endpoint_health.n_unreachable === 0
                          ? " — the endpoint was answering, so the failure is on the client side"
                          : ", so the endpoint really was unavailable"}</div>`
                   : ""}`
              : "",
            t && t.n_checks
              ? `<div class="t-r"><b>${t.n_checks_passed}</b> of <b>${t.n_checks}</b> checks passed</div>`
              : "",
            checkList(t),
            t ? `<div class="t-r">wall clock <b>${dur(t.duration_s)}</b></div>` : "",
            t && t.n_output_tokens != null ? `<div class="t-r">output tokens <b>${int(t.n_output_tokens)}</b></div>` : "",
            t && t.error_type ? `<div class="t-r">exception <b>${esc(t.error_type)}</b></div>` : "",
            // The exception type alone names almost nothing: eight identical
            // `UnknownApiError` cells said only that an API call failed, while
            // the sentence explaining it -- a chat template refusing the
            // request -- was in the message the tooltip did not show. Both are
            // here now, the named failure first because it carries the fix.
            t && t.error_finding
              ? `<div class="t-r">${esc(t.error_finding.title)}
                   ${t.error_finding.fix
                      ? `<div class="mono-dim">fix: ${esc(t.error_finding.fix)}</div>`
                      : ""}</div>`
              : "",
            t && t.error_message
              ? `<div class="t-r"><div class="mono-dim err-msg">${esc(t.error_message)}</div></div>`
              : "",
            // Not labelled "exception": it is a scored failure, and the row
            // exists to explain why a failed cell has no checks to show rather
            // than to report something going wrong.
            t && t.no_reward_reason
              ? `<div class="t-r">no score produced <b>${esc(t.no_reward_reason)}</b>
                   <div class="mono-dim">the verifier ran; the work could not be
                   scored, usually because it did not build</div></div>`
              : "",
          ].join("");
          const mods = `${c.late ? " late" : ""}${c.near ? " near" : ""}`;
          return `<td><div class="cell-wrap"><div class="cell ${c.cls}${mods}" data-tip="${esc(tipHtml)}">${c.glyph}</div></div></td>`;
        }).join("")}
      </tr>`).join("");

  const body = tasks.length
    ? `<table class="mx">
         <thead>${head}</thead>
         <tbody>${rows}</tbody>
       </table>
       <div class="mx-legend">${legendFor(seenKinds)}</div>`
    : `<div class="empty">${state.diffOnly ? "No disagreements — every harness got the same verdict on every shared task." : "No tasks yet."}</div>`;

  const note = `<label style="cursor:pointer;color:var(--ink-2)">
      <input type="checkbox" id="diffonly" ${state.diffOnly ? "checked" : ""}> disagreements only
    </label>`;
  return panel("mx", "task matrix", note, body, null, "matrix");
}

/* ---------------------------- 5. efficiency ----------------------------- */

function renderEfficiency(runs) {
  const pts = runs.filter(
    (r) => r.median_duration_s != null && r.mean_output_tokens_per_solve != null
  );
  if (pts.length < 1) {
    return panel("eff", "cost of a solve", "",
      `<div class="empty">Appears once a trial reports token usage.</div>`,
      null, "eff");
  }

  const W = 760, H = 340, M = { t: 18, r: 26, b: 46, l: 74 };
  const xs = pts.map((p) => p.median_duration_s);
  const ys = pts.map((p) => p.mean_output_tokens_per_solve);
  const xMax = Math.max(...xs) * 1.18 || 1;
  const yMax = Math.max(...ys) * 1.18 || 1;
  const px = (v) => M.l + (v / xMax) * (W - M.l - M.r);
  const py = (v) => H - M.b - (v / yMax) * (H - M.t - M.b);

  const xTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * xMax);
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * yMax);

  const body = `
    <div class="scatter">
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Median task wall clock versus mean output tokens per solved task">
      ${yTicks.map((t) => `
        <line x1="${M.l}" y1="${py(t)}" x2="${W - M.r}" y2="${py(t)}"
              stroke="var(--grid)" stroke-width="1"/>
        <text class="sc-axis" x="${M.l - 10}" y="${py(t) + 4}" text-anchor="end">${int(t)}</text>`).join("")}
      ${xTicks.map((t) => `
        <text class="sc-axis" x="${px(t)}" y="${H - M.b + 20}" text-anchor="middle">${dur(t)}</text>`).join("")}
      <line x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}"
            stroke="var(--baseline)" stroke-width="1"/>
      <line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}"
            stroke="var(--baseline)" stroke-width="1"/>
      <text class="sc-axis" x="${M.l}" y="${H - 8}" text-anchor="start">median task wall clock →</text>
      <text class="sc-axis" x="${-(H / 2)}" y="16" transform="rotate(-90)" text-anchor="middle">mean output tokens per solved task →</text>
      ${pts.map((p) => {
        const c = colorOf(p.harness);
        const x = px(p.median_duration_s), y = py(p.mean_output_tokens_per_solve);
        const tipHtml = [
          `<div class="t-h">${esc(p.harness_label)}</div>`,
          `<div class="t-r">pass rate <b>${pct(p.pass_rate)}</b></div>`,
          `<div class="t-r">median task <b>${dur(p.median_duration_s)}</b></div>`,
          `<div class="t-r">out tokens / solve <b>${int(p.mean_output_tokens_per_solve)}</b></div>`,
          // The same tokens over every trial. A harness that solves the cheap
          // tasks and burns the budget on the ones it fails reads as cheap on
          // the axis above and expensive here; that gap is the finding.
          `<div class="t-r">out tokens / trial <b>${int(p.mean_output_tokens_per_trial)}</b>${
            p.n_token_samples != null && p.n_token_samples < p.n_done
              ? ` <span class="sub">over ${p.n_token_samples} of ${p.n_done}</span>` : ""}</div>`,
        ].join("");
        return `
          <g data-tip="${esc(tipHtml)}">
            <circle cx="${x}" cy="${y}" r="16" fill="transparent"/>
            <circle cx="${x}" cy="${y}" r="7" fill="${c}"
                    stroke="var(--surface)" stroke-width="2"/>
            <text class="sc-label" x="${x + 13}" y="${y + 4}">${esc(p.harness_label)}</text>
          </g>`;
      }).join("")}
    </svg>
    </div>`;

  const table = `
    <table class="data">
      <thead><tr><th>harness</th><th class="num">median task</th>
        <th class="num">out tokens / solve</th><th class="num">out tokens / trial</th>
        <th class="num">pass rate</th></tr></thead>
      <tbody>${pts.map((p) => `
        <tr><td>${esc(p.harness_label)}</td>
          <td class="num">${dur(p.median_duration_s)}</td>
          <td class="num">${int(p.mean_output_tokens_per_solve)}</td>
          <td class="num">${int(p.mean_output_tokens_per_trial)}</td>
          <td class="num">${pct(p.pass_rate)}</td></tr>`).join("")}
      </tbody>
    </table>`;

  // Paired with cost-of-a-run, which is the same chart over every trial. Each
  // note leads with its denominator, because that is the only difference
  // between them and the one that decides which harness looks cheap.
  return panel("eff", "cost of a solve",
               "only the tasks it solved · lower-left is cheaper + faster",
               body, table, "eff");
}

/* --------------------------- 5b. cost of a run --------------------------- */

/* The same chart as cost-of-a-solve, against the other cost.
 *
 * Per-solve rewards a harness for losing cheaply: it counts only the tasks that
 * worked. Measured on one sweep, claude-code averaged 26k output tokens per
 * solved task and 125k per trial, because the tasks it solved were the cheap
 * ones and the ones it lost ran to six figures; opencode's two figures were
 * within 10% of each other. Same axes and same scale rules as its sibling, so
 * the two panels can be read against each other -- a harness that moves a long
 * way up between them is one whose failures are expensive.
 */
function renderCost(runs) {
  const pts = runs.filter(
    (r) => r.median_duration_s != null && r.mean_output_tokens_per_trial != null
  );
  if (pts.length < 1) {
    return panel("cost", "cost of a run", "",
      `<div class="empty">Appears once a trial reports token usage.</div>`,
      null, "cost");
  }

  const W = 760, H = 340, M = { t: 18, r: 26, b: 46, l: 74 };
  const xs = pts.map((p) => p.median_duration_s);
  const ys = pts.map((p) => p.mean_output_tokens_per_trial);
  const xMax = Math.max(...xs) * 1.18 || 1;
  const yMax = Math.max(...ys) * 1.18 || 1;
  const px = (v) => M.l + (v / xMax) * (W - M.l - M.r);
  const py = (v) => H - M.b - (v / yMax) * (H - M.t - M.b);

  const xTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * xMax);
  const yTicks = [0, 0.25, 0.5, 0.75, 1].map((f) => f * yMax);

  const body = `
    <div class="scatter">
    <svg viewBox="0 0 ${W} ${H}" role="img"
         aria-label="Median task wall clock versus mean output tokens per trial">
      ${yTicks.map((t) => `
        <line x1="${M.l}" y1="${py(t)}" x2="${W - M.r}" y2="${py(t)}"
              stroke="var(--grid)" stroke-width="1"/>
        <text class="sc-axis" x="${M.l - 10}" y="${py(t) + 4}" text-anchor="end">${int(t)}</text>`).join("")}
      ${xTicks.map((t) => `
        <text class="sc-axis" x="${px(t)}" y="${H - M.b + 20}" text-anchor="middle">${dur(t)}</text>`).join("")}
      <line x1="${M.l}" y1="${H - M.b}" x2="${W - M.r}" y2="${H - M.b}"
            stroke="var(--baseline)" stroke-width="1"/>
      <line x1="${M.l}" y1="${M.t}" x2="${M.l}" y2="${H - M.b}"
            stroke="var(--baseline)" stroke-width="1"/>
      <text class="sc-axis" x="${M.l}" y="${H - 8}" text-anchor="start">median task wall clock →</text>
      <text class="sc-axis" x="${-(H / 2)}" y="16" transform="rotate(-90)" text-anchor="middle">mean output tokens per trial →</text>
      ${pts.map((p) => {
        const c = colorOf(p.harness);
        const x = px(p.median_duration_s), y = py(p.mean_output_tokens_per_trial);
        // Not every trial reports usage, so the mean can be over fewer trials
        // than the run scored. A narrowed sample that says nothing reads as
        // full coverage.
        const short = p.n_token_samples != null && p.n_token_samples < p.n_done;
        const tipHtml = [
          `<div class="t-h">${esc(p.harness_label)}</div>`,
          `<div class="t-r">pass rate <b>${pct(p.pass_rate)}</b></div>`,
          `<div class="t-r">median task <b>${dur(p.median_duration_s)}</b></div>`,
          `<div class="t-r">out tokens / trial <b>${int(p.mean_output_tokens_per_trial)}</b>${
            short ? ` <span class="sub">over ${p.n_token_samples} of ${p.n_done};`
                    + ` the rest reported no usage</span>` : ""}</div>`,
        ].join("");
        return `
          <g data-tip="${esc(tipHtml)}">
            <circle cx="${x}" cy="${y}" r="16" fill="transparent"/>
            <circle cx="${x}" cy="${y}" r="7" fill="${c}"
                    stroke="var(--surface)" stroke-width="2"/>
            <text class="sc-label" x="${x + 13}" y="${y + 4}">${esc(p.harness_label)}</text>
          </g>`;
      }).join("")}
    </svg>
    </div>`;

  const table = `
    <table class="data">
      <thead><tr><th>harness</th><th class="num">median task</th>
        <th class="num">out tokens / trial</th><th class="num">trials counted</th>
        <th class="num">pass rate</th></tr></thead>
      <tbody>${pts.map((p) => `
        <tr><td>${esc(p.harness_label)}</td>
          <td class="num">${dur(p.median_duration_s)}</td>
          <td class="num">${int(p.mean_output_tokens_per_trial)}</td>
          <td class="num">${p.n_token_samples ?? "—"}/${p.n_done}</td>
          <td class="num">${pct(p.pass_rate)}</td></tr>`).join("")}
      </tbody>
    </table>`;

  // Same reading as its sibling, because it is the same chart against the
  // other cost: left is faster, low is cheaper. What differs is the denominator,
  // so the note leads with that.
  return panel("cost", "cost of a run",
               "every trial, won or lost · lower-left is cheaper + faster",
               body, table, "cost");
}

/* ------------------------------ 6. run log ------------------------------ */

/* How many runs the run log shows before it scrolls.

   Every other panel is bounded by what it draws; this one is a row per run and
   grows without limit, so after a few sweeps it owned most of the page and
   pushed the charts off the bottom. Bounded here rather than by a fixed height
   in CSS because a row carries a variable number of sub-lines -- a run with two
   error types is half again as tall as a clean one -- so a height in pixels
   shows four rows on one screen and six on another. */
const RUN_LOG_ROWS = 5;

/* Cut the run log to exactly RUN_LOG_ROWS, measured after layout.

   Cleared before measuring: this runs on every poll, and measuring a box that
   is already capped and scrolled would compound the previous answer. The header
   is sticky inside the scroller, so its height is added rather than counted
   against the rows.

   Skipped inside the expanded dialog -- expanding a panel is the request to see
   all of it. */
function sizeRunLog() {
  document.querySelectorAll(".log-scroll").forEach((box) => {
    box.style.maxHeight = "";
    if (box.closest(".modal-backdrop")) return;
    const limit = Number(box.getAttribute("data-max-rows")) || RUN_LOG_ROWS;
    const rows = box.querySelectorAll("tbody tr");
    if (rows.length <= limit) return;
    const head = box.querySelector("thead");
    const headH = head ? head.getBoundingClientRect().height : 0;
    const first = rows[0].getBoundingClientRect().top;
    const cut = rows[limit].getBoundingClientRect().top;
    box.style.maxHeight = `${Math.round(headH + (cut - first))}px`;
  });
}

function renderRunLog(data) {
  const all = data.runs || [];
  // Follows the picker: it is the panel you look at to see what you selected,
  // so showing everything here while the charts show a subset would make the
  // filter look broken.
  const filtered = state.runPick === null
    ? all
    : all.filter((r) => state.runPick.has(r.run_id));
  const runs = filtered;
  if (!all.length) {
    return panel("log", "run log", "", `<div class="empty">Nothing on disk yet.</div>`, null, "log");
  }
  if (!runs.length) {
    return panel("log", "run log", `0 of ${all.length} selected`,
      `<div class="empty">No runs selected. Use the <b>runs</b> filter to pick some.</div>`,
      null, "log");
  }
  const body = `
    <div class="log-scroll" data-pane="log-rows" data-max-rows="${RUN_LOG_ROWS}">
    <table class="data">
      <thead><tr>
        <th>started</th><th>harness</th><th>model</th><th class="num">pass</th>
        <th class="num">elapsed</th>
        <th class="num">conc.</th><th class="num">time&times;</th><th>status</th>
        <th>errors</th><th>harbor</th>
      </tr></thead>
      <tbody>${runs.map((r) => {
        const errs = Object.entries(r.error_types || {});
        return `
        <tr>
          <td>${shortTime(r.started_at)}</td>
          <td>${esc(r.harness_label)} ${scopeBadge(r)}<div class="mono-dim">${esc(r.agent_ref || "")}</div></td>
          <td>${esc(r.model_label)}<div class="mono-dim">${esc(r.model_quant || "")}</div></td>
          <td class="num">${r.n_done ? pct(r.pass_rate) : "—"}<div class="mono-dim">${r.n_resolved}/${r.n_done}</div></td>
          <td class="num">${r.agent_total_s != null ? dur(r.agent_total_s)
                            : r.wall_clock_s ? dur(r.wall_clock_s) : "—"}
              ${r.wall_clock_s && r.agent_total_s != null
                ? `<div class="mono-dim" title="${
                     r.llm_busy_pct != null ? r.llm_busy_pct.toFixed(0) + "% of the wall clock was the model generating. " : ""
                   }The rest is image pulls, container builds, harness installs and verifiers — the same cost for every harness, which is why it is not the headline.">${dur(r.wall_clock_s)} wall</div>`
                : ""}</td>
          <td class="num">${r.n_concurrent == null ? "—" : r.n_concurrent}</td>
          <td class="num">${r.agent_timeout_multiplier == null ? "—" : r.agent_timeout_multiplier + "×"}
              ${r.n_timeouts ? `<div class="mono-dim" style="color:var(--warning)">${r.n_timeouts} hit the limit</div>` : ""}</td>
          <td><span class="status-pill ${r.status}"
                    ${r.stopped_reason ? `title="${esc(r.stopped_reason)}"` : ""}>${
                      r.status === "running" ? "● running"
                      : r.status === "stopped" ? "■ stopped"
                      : "○ complete"
                    }</span>
              <div class="mono-dim">${r.n_done}/${r.n_total}</div></td>
          <td>${errs.length
                ? errs.map(([k, v]) => `<div class="mono-dim">${esc(k)} ×${v}</div>`).join("")
                : `<span class="mono-dim">none</span>`}</td>
          <td class="mono-dim">${esc(r.harbor_version || "")}</td>
        </tr>`;
      }).join("")}
      </tbody>
    </table>
    </div>`;
  // Says so when there is more below the fold, because a scroller whose
  // scrollbar is the only hint reads as "these are all the runs".
  const hidden = runs.length - RUN_LOG_ROWS;
  const note = (state.runPick === null
    ? "every run on disk, newest first"
    : `${runs.length} of ${all.length} runs selected`)
    + (hidden > 0 ? ` &middot; ${hidden} more below` : "");
  return panel("log", "run log", note, body, null, "log");
}

/* ------------------------------- filters -------------------------------- */

/* A checkbox menu of every run for this model, grouped by scope and labelled
   with when it started. Selecting runs by name alone is not enough once a
   subset has been re-run -- which is the normal case here, since every model
   swap re-runs everything -- so the start time is part of the label rather
   than a tooltip. */
function renderRunPicker(data) {
  const groups = runGroups(data);
  const all = groups.flatMap((g) => g.runs);
  if (!all.length) return `<span class="mono-dim">none yet</span>`;

  const picked = (r) => state.runPick === null || state.runPick.has(r.run_id);
  const nOn = all.filter(picked).length;
  // Counted in sweeps, not harnesses: seven harness runs across two sweeps is
  // "two runs" to whoever started them, and "7" invites the question "of what".
  const groupsOn = groups.filter((g) => g.runs.some(picked)).length;
  const summary = state.runPick === null
    ? `all ${groups.length}`
    : `${groupsOn} of ${groups.length}`;

  const rows = groups.map((g) => {
    const on = g.runs.filter(picked).length;
    return `
      <div class="pick-group">
        <button class="pick-head" data-pick-group="${esc(g.key)}"
                title="Toggle every harness in this run">
          <span class="pick-box ${on === g.runs.length ? "on" : on ? "some" : ""}"></span>
          ${esc(g.name)}
          <span class="mono-dim">${esc(shortTime(g.startedAt))} ·
            ${on}/${g.runs.length} harnesses</span>
        </button>
        ${g.runs.map((r) => `
          <button class="pick-row" data-pick-run="${esc(r.run_id)}">
            <span class="pick-box ${picked(r) ? "on" : ""}"></span>
            <span class="pick-when">${esc(shortTime(r.started_at))}</span>
            <span class="pick-name">${esc(r.harness_label)}</span>
            <span class="mono-dim">${r.n_done}/${r.n_total}${
              r.wall_clock_s ? " · " + dur(r.wall_clock_s) : ""}</span>
          </button>`).join("")}
      </div>`;
  }).join("");

  return `
    <div class="picker">
      <button class="chip" id="run-picker-toggle"
              aria-pressed="${state.runPick === null ? "false" : "true"}">
        ${summary} &#9662;
      </button>
      <div class="picker-menu" ${state.runMenuOpen ? "" : "hidden"}>
        <div class="picker-actions">
          <button class="ghost" data-pick-all="1">select all</button>
          <button class="ghost" data-pick-none="1">select none</button>
        </div>
        ${rows}
      </div>
    </div>`;
}

function renderFilters(data, runs) {
  const models = modelsOf(data);
  const harnesses = [];
  const seen = new Set();
  // Only harnesses that ran the selected benchmark. A chip for one that did not
  // is permanently inert, and toggling it looks broken rather than empty.
  runsInScope(data).forEach((r) => {
    if (!seen.has(r.harness)) {
      seen.add(r.harness);
      harnesses.push({ id: r.harness, label: r.harness_label });
    }
  });
  // Discovered in run order, which is the order the sweep happened to run
  // them in; the reader is looking one up, not replaying the sweep.
  harnesses.sort(byHarnessName);

  const scoped = runsInScope(data);
  const conc = new Set(scoped.map((r) => r.n_concurrent).filter((c) => c != null));
  const mult = new Set(
    scoped.map((r) => r.agent_timeout_multiplier).filter((m) => m != null)
  );
  const warnings = [];
  if (conc.size > 1) {
    warnings.push(`runs used different concurrency (${[...conc].join(", ")}) &mdash;
      wall-clock is not comparable across them`);
  }
  if (mult.size > 1) {
    // Different time budgets is the one mismatch that changes pass rate itself,
    // not just timing -- a harness given 8x longer simply finishes more tasks.
    warnings.push(`runs used different time budgets (${[...mult].map((m) => m + "×").join(", ")})
      &mdash; pass rates are <b>not</b> comparable across them`);
  }
  const warn = warnings.length
    ? `<span class="filter-label" style="color:var(--warning);text-transform:none;letter-spacing:0">
         &#9888; ${warnings.join(" &middot; ")}
       </span>`
    : "";

  // What the smoke filter is removing right now: every clause of visibleRuns
  // except the filter itself. Reported so a missing run is always accounted
  // for on screen rather than leaving the reader to wonder where it went.
  const nSmokeHidden = runsInScope(data).filter(
    (r) => !state.hidden.has(r.harness)
        && isSmoke(r)
        && (state.runPick === null || state.runPick.has(r.run_id))
  ).length;

  // Order is deliberate: what you are looking at (model and benchmark, then the
  // headline numbers for that pair), then what you are filtering out of it. The
  // selectors used to share one line with the model; in a single column they
  // read as a sequence.
  //
  // Benchmark sits beside model because it is the same kind of control: both
  // scope the entire view, and neither is a filter you can leave off. A total
  // pooled across benchmarks is not a weaker number, it is a meaningless one.
  const benchmarks = datasetsOf(data);
  return `
    <div class="filters">
      <div class="filter-row">
        <div class="filter-group" style="flex:1 1 auto;min-width:0">
          <span class="filter-label">model</span>
          <select id="model-select">
            ${models.map((m) => {
              const key = m.fingerprint || m.label;
              return `<option value="${esc(key)}" ${key === state.model ? "selected" : ""}>
                ${esc(m.label)}${m.quant ? " — " + esc(m.quant) : ""} (${m.runs.length} run${m.runs.length === 1 ? "" : "s"})
              </option>`;
            }).join("")}
          </select>
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-group" style="flex:1 1 auto;min-width:0">
          <span class="filter-label">benchmark</span>
          <select id="dataset-select">
            ${benchmarks.map((d) => `
              <option value="${esc(d.key)}" ${d.key === state.dataset ? "selected" : ""}>
                ${esc(d.label)} (${d.n} run${d.n === 1 ? "" : "s"})
              </option>`).join("")}
          </select>
        </div>
      </div>
      ${renderTiles(data, runs || [])}
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">harness</span>
          ${harnesses.map((h) => `
            <button class="chip" data-harness="${esc(h.id)}"
                    aria-pressed="${state.hidden.has(h.id) ? "false" : "true"}">
              <span class="swatch" style="background:${colorOf(h.id)}"></span>${esc(h.label)}
            </button>`).join("")}
        </div>
      </div>
      <div class="filter-row">
        <div class="filter-group">
          <span class="filter-label">runs</span>
          ${renderRunPicker(data)}
        </div>
        <div class="filter-group">
          <label class="check"
                 title="An ad-hoc --n-tasks run answers 'does the adapter work', not 'how good is this harness'. Off by default: nothing disappears unless you ask it to, and the count says what is being hidden while it is on.">
            <input type="checkbox" id="partial-toggle"
                   ${state.hidePartial ? "checked" : ""}>
            hide smoke runs
            ${state.hidePartial && nSmokeHidden
                ? `<span class="count">${nSmokeHidden} hidden</span>`
                : ""}
          </label>
        </div>
      </div>
      ${warn}
    </div>`;
}

/* ------------------------------- render --------------------------------- */

function render() {
  const data = state.data;
  const app = $("#app");
  if (!data) return;

  const models = modelsOf(data);
  if (!models.length) {
    // An empty results page is the one screen that cannot explain itself: every
    // control on it is derived from runs, so with no runs there is nothing to
    // scope, filter or compare and the page has nothing to say. Say what to do
    // instead of showing an empty grid -- and name the step, because the tab
    // order is not the order you use them in.
    app.innerHTML = `<div class="empty">
      <b>No runs yet.</b><br><br>
      ${READONLY ? "This snapshot was exported before any run finished."
        : `Point the rig at your model on the <b>Setup</b> tab, then start a
           benchmark on the <b>Run</b> tab. Results appear here as each trial
           lands — you do not have to wait for the run to finish.<br><br>
           From a terminal instead:<br>
           <code>conda run --no-capture-output -n harness-arena python -m bench.runner</code>`}
    </div>`;
    return;
  }
  if (!state.model || !models.some((m) => (m.fingerprint || m.label) === state.model)) {
    state.model = models[0].fingerprint || models[0].label;
  }
  // Resolved after the model, and re-resolved whenever the current choice is
  // not among that model's benchmarks -- which is the normal case immediately
  // after switching models, since not every model has run every benchmark.
  // Defaults to the benchmark of the newest run rather than the first
  // alphabetically: what you just started is what you came to look at.
  const benchmarks = datasetsOf(data);
  if (benchmarks.length
      && (state.dataset === null || !benchmarks.some((d) => d.key === state.dataset))) {
    const newest = runsForModel(data)
      .slice()
      .sort((a, b) => (b.started_at || "").localeCompare(a.started_at || ""))[0];
    state.dataset = newest ? datasetKey(newest) : benchmarks[0].key;
  }
  // Stable color assignment: walk every run once, in a fixed order, so a
  // harness keeps its hue no matter which model or filter is selected.
  [...(data.runs || [])]
    .sort((a, b) => (a.started_at || "").localeCompare(b.started_at || ""))
    .forEach((r) => colorOf(r.harness));

  const runs = visibleRuns(data);

  // Preserve the feed's scroll position across the 5s re-render, unless the
  // user is already pinned to the bottom -- in which case follow the output.
  // Anchored to the *bottom*, not to scrollTop: the feed is a sliding window
  // over a growing log, so each refresh drops text off the top as well as
  // adding it at the end. Restoring a pixel offset from the top would slide
  // the reader backwards through the text every five seconds.
  const prevFeed = $("#feed-scroll");
  const wasPinned = prevFeed
    ? prevFeed.scrollTop + prevFeed.clientHeight >= prevFeed.scrollHeight - 24
    : true;
  const prevFromBottom = prevFeed ? prevFeed.scrollHeight - prevFeed.scrollTop : 0;

  // Every other scrollable panel keeps its place too. The whole results view is
  // rebuilt from scratch on each poll, which silently threw the reader back to
  // the top of an 89-row matrix every five seconds -- unusable for exactly the
  // long runs the matrix exists to read.
  const panes = capturePaneScroll();

  const feedHtml = renderFeed();
  app.innerHTML =
    `<div class="grid" data-feed="${feedHtml ? "on" : "off"}">` +
      renderFilters(data, runs) +
      feedHtml +
      renderLeaderboard(runs) +
      renderMatrix(data, runs) +
      renderEfficiency(runs) +
      renderCost(runs) +
      renderRunLog(data) +
    `</div>`;

  restorePaneScroll(panes);
  // After layout, and before mountExpanded clones the panel: the clone drops
  // the cap itself.
  sizeRunLog();

  const feed = $("#feed-scroll");
  if (feed) {
    feed.scrollTop = wasPinned
      ? feed.scrollHeight
      : Math.max(0, feed.scrollHeight - prevFromBottom);
  }

  $("#foot").textContent =
    `${data.summary.n_runs} runs · ${data.summary.n_harnesses} harnesses · `
    + `${data.summary.n_models} models · scanned ${new Date(data.generated_at).toLocaleTimeString()}`;

  // Before wireEvents, deliberately: the expanded copy carries the same
  // data-table and data-expand attributes, so the one wiring pass covers both
  // and its controls behave identically to the panel it came from.
  mountExpanded();
  wireEvents();
}

/* Re-mounted from scratch on every render rather than left alone, so an
   expanded panel keeps updating on the five-second poll. It is a clone of the
   freshly rendered panel, which means there is no second rendering path to
   keep in step with the first. */
function mountExpanded() {
  const app = $("#app");
  if (!app || !state.expanded) return;
  const source = app.querySelector(`.panel[data-panel="${state.expanded}"]`);
  if (!source) { state.expanded = null; return; }   // panel gone this render

  const clone = source.cloneNode(true);
  // Ids and data-pane must not be duplicated: the originals own them, and
  // capturePaneScroll keys on data-pane, so a copy would overwrite the real
  // panel's remembered position with the modal's.
  clone.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
  clone.querySelectorAll("[data-pane]").forEach((el) => el.removeAttribute("data-pane"));
  // Expanding a panel is the request to see all of it, so the run log's
  // five-row cap comes off the copy. Inline, because it is set inline.
  clone.querySelectorAll(".log-scroll").forEach((el) => (el.style.maxHeight = ""));
  clone.removeAttribute("style");

  const actions = clone.querySelector(".panel-head > div:last-child");
  if (actions) {
    actions.insertAdjacentHTML("beforeend",
      `<button class="modal-close" data-close-modal="1" aria-label="Close">esc &#10005;</button>`);
  }

  const backdrop = document.createElement("div");
  backdrop.className = "modal-backdrop";
  backdrop.setAttribute("role", "dialog");
  backdrop.setAttribute("aria-modal", "true");
  backdrop.setAttribute("data-modal", "1");
  backdrop.appendChild(clone);
  app.appendChild(backdrop);

  // The feed scrolls inside `.feed`, not `.panel-body`. Driving the body would
  // move an element the reader is not looking through, which is why the
  // expanded feed sat wherever it opened instead of following the output.
  const tail = clone.querySelector(".feed");
  const scroller = tail || clone.querySelector(".panel-body");
  if (scroller) {
    if (tail) {
      // Follow the newest output only while already there. Otherwise hold
      // position relative to the tail, so a poll landing mid-read does not
      // yank the reader to the bottom.
      scroller.scrollTop =
        tailScrollTop(scroller.scrollHeight, expandedPinned, expandedFromBottom);
    } else {
      scroller.scrollTop = expandedScroll;
    }
    scroller.onscroll = () => {
      expandedScroll = scroller.scrollTop;
      expandedFromBottom = scroller.scrollHeight - scroller.scrollTop;
      expandedPinned = tailIsPinned(
        scroller.scrollTop, scroller.clientHeight, scroller.scrollHeight);
    };
  }
}

function closeExpanded() {
  if (!state.expanded) return;
  state.expanded = null;
  expandedScroll = 0;
  expandedFromBottom = 0;
  expandedPinned = true;
  render();
}

function wireEvents() {
  const sel = $("#model-select");
  // Clearing the benchmark rather than keeping it: the new model may not have
  // run the selected one, and render() re-resolves a null to that model's
  // newest. Keeping it would leave the view empty with both selectors looking
  // perfectly reasonable.
  if (sel) sel.onchange = (e) => {
    state.model = e.target.value;
    state.dataset = null;
    // Run ids are per-benchmark, so a pick made under the old scope selects
    // nothing under the new one -- which reads as "this model has no runs".
    state.runPick = null;
    render();
  };

  const dsSel = $("#dataset-select");
  if (dsSel) dsSel.onchange = (e) => {
    state.dataset = e.target.value;
    state.runPick = null;
    render();
  };

  document.querySelectorAll("[data-harness]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-harness");
      if (state.hidden.has(id)) state.hidden.delete(id); else state.hidden.add(id);
      render();
    };
  });

  const pickerToggle = $("#run-picker-toggle");
  if (pickerToggle) pickerToggle.onclick = () => {
    state.runMenuOpen = !state.runMenuOpen;
    render();
  };

  // Every run currently offered, so "all" and a group toggle agree on what
  // the universe is -- the picker must never be able to select a run that is
  // not in it.
  const offered = runGroups(state.data).flatMap((g) => g.runs);
  const pickedNow = () =>
    state.runPick === null
      ? new Set(offered.map((r) => r.run_id))
      : new Set(state.runPick);
  const commit = (next) => {
    // Collapsing "everything" back to null keeps the chip honest and means a
    // run added later is included rather than silently excluded.
    state.runPick = next.size === offered.length ? null : next;
    render();
  };

  document.querySelectorAll("[data-pick-run]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-pick-run");
      const next = pickedNow();
      if (next.has(id)) next.delete(id); else next.add(id);
      commit(next);
    };
  });

  document.querySelectorAll("[data-pick-group]").forEach((btn) => {
    btn.onclick = () => {
      const key = btn.getAttribute("data-pick-group");
      const group = (runGroups(state.data).find((g) => g.key === key) || {}).runs || [];
      const next = pickedNow();
      const allOn = group.every((r) => next.has(r.run_id));
      group.forEach((r) => (allOn ? next.delete(r.run_id) : next.add(r.run_id)));
      commit(next);
    };
  });

  const pickAll = document.querySelector("[data-pick-all]");
  if (pickAll) pickAll.onclick = () => { state.runPick = null; render(); };
  const pickNone = document.querySelector("[data-pick-none]");
  if (pickNone) pickNone.onclick = () => { state.runPick = new Set(); render(); };

  document.querySelectorAll("[data-table]").forEach((btn) => {
    btn.onclick = () => {
      const id = btn.getAttribute("data-table");
      if (state.tableView.has(id)) state.tableView.delete(id); else state.tableView.add(id);
      render();
    };
  });

  const partial = $("#partial-toggle");
  // `change`, not `click`: the input sits inside its label, so a click on the
  // text toggles the box natively and a click handler would then invert it a
  // second time. Read the box rather than negating state, so the two can never
  // disagree.
  if (partial) {
    partial.onchange = (event) => {
      state.hidePartial = event.target.checked;
      render();
    };
  }

  const diff = $("#diffonly");
  if (diff) diff.onchange = (e) => { state.diffOnly = e.target.checked; render(); };

  document.querySelectorAll("[data-expand]").forEach((btn) => {
    btn.onclick = () => {
      // Opening a different panel while one is open just switches, rather than
      // stacking dialogs nobody asked for. Opening starts pinned, so the feed
      // shows the newest output rather than wherever it happened to be.
      expandedScroll = 0;
      expandedFromBottom = 0;
      expandedPinned = true;
      state.expanded = btn.getAttribute("data-expand");
      render();
    };
  });

  document.querySelectorAll("[data-close-modal]").forEach((btn) => {
    btn.onclick = closeExpanded;
  });

  const backdrop = document.querySelector("[data-modal]");
  if (backdrop) {
    // Only a click on the backdrop itself. Without the target check, any click
    // that bubbles up from inside the panel would close it -- including one
    // that just finished selecting text in the matrix.
    backdrop.onclick = (e) => { if (e.target === backdrop) closeExpanded(); };
  }
}

/* ========================== control plane ===============================
   Everything below drives the non-Results tabs: configuration, launching,
   stopping and maintenance.

   Forms here are uncontrolled and re-rendered only on demand -- on tab
   switch and after an action. The results poll runs every 5s, and
   re-rendering a form on that tick would discard whatever the user was
   part-way through typing. The Run tab's status bar and console are the
   exception: they update in place, touching no input.
------------------------------------------------------------------------ */

const TOKEN = window.__HARNESS_ARENA_TOKEN__ || null;
const READONLY = !!window.__HARNESS_ARENA_READONLY__ || !TOKEN;

const cp = {
  tab: "results",
  server: null,        // GET /api/state
  notice: {},          // tab -> {kind, text}
  busy: null,          // name of the in-flight action, for button disabling
  log: [],             // captured lines from the active job
  logPinned: true,
  probe: null,         // last connection-test result
  models: null,        // {models, default, discoverable} from the endpoint
  doctor: null,
  // The console's last failure, named. Held rather than recomputed on every
  // repaint because naming it is a round trip, and the console repaints every
  // couple of seconds while a run is going.
  failure: null,
  failureFrom: "",
  // The running job's newest failed trial, from GET /api/run/log. Harbor's
  // console says a command failed; only the trial's own result.json says why.
  trialFailure: null,
  orphans: null,       // GET /api/containers: leftover containers, networks, pool
  editing: null,       // harness id open in the editor, or "+" for a new one
};

/* Every mutating call carries the per-process token in a custom header.
   Custom headers cannot be set by cross-origin script without a preflight,
   and the server answers none -- so this is what makes the control plane
   unreachable from any other page in the browser. */
async function api(path, { method = "GET", body } = {}) {
  const opts = { method, cache: "no-store", headers: {} };
  if (body !== undefined) {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(body);
  }
  if (method !== "GET" && TOKEN) opts.headers["X-Harness-Arena-Token"] = TOKEN;
  const res = await fetch(path, opts);
  let payload = null;
  try { payload = await res.json(); } catch (_) { /* empty body */ }
  if (!res.ok) throw new Error((payload && payload.error) || `HTTP ${res.status}`);
  return payload;
}

function notice(tab, kind, text) {
  cp.notice[tab] = text ? { kind, text } : null;
}
function noticeHtml(tab) {
  const n = cp.notice[tab];
  return n ? `<div class="note ${n.kind}">${esc(n.text)}</div>` : "";
}

/* Run an action with the button disabled and the outcome reported, so no
   path can fail silently or be double-submitted. */
/* Disable a pane's controls without re-rendering it.

   Re-rendering here would be a bug, and was one: renderTab() replaces the
   pane's innerHTML, so the inputs the user just filled in are destroyed and
   rebuilt from stored state. Since fn() reads the form, it would then read the
   *rebuilt* fields -- submitting the old values, or empty ones that the server
   resolves to provider defaults. Every save and every connection test silently
   used the previous configuration. */
function setPaneBusy(on) {
  const tab = TABS[cp.tab];
  const pane = tab && $("#" + tab.pane);
  if (!pane || !pane.querySelectorAll) return;
  pane.querySelectorAll("button").forEach((b) => { b.disabled = !!on; });
}

async function act(tab, name, fn, okMessage) {
  cp.busy = name;
  setPaneBusy(true);
  try {
    // fn() reads the live DOM. Nothing may re-render before this point.
    const result = await fn();
    notice(tab, "ok", typeof okMessage === "function" ? okMessage(result) : okMessage);
    await refreshServerState();
    // The refetch above is authoritative for everything except what the user is
    // still editing, so the draft goes back on top of it.
    if (cp.setupDraft && cp.server) {
      cp.server.config.endpoint = { ...cp.server.config.endpoint, ...cp.setupDraft };
    }
  } catch (err) {
    // okMessage === null means the caller renders its own result panel, so a
    // generic banner here would just show the same error twice.
    if (okMessage !== null) notice(tab, "bad", String(err.message || err));
  } finally {
    cp.busy = null;
    setPaneBusy(false);
    renderTab(cp.tab);
  }
}

async function refreshServerState() {
  try {
    cp.server = await api("/api/state");
  } catch (_) { /* leave the previous state up */ }
}

/* Re-read the results index into state.data.

   act() refreshes /api/state, which knows nothing about which run directories
   exist -- that is state.data, and it is only refetched by the 5s poll, which
   re-renders the results tab and no other. So a run deleted from the upkeep tab
   was gone on disk and still listed on screen: act() re-rendered from the copy
   of state.data it already had, and the poll that fixed state.data never
   repainted the tab the user was looking at. Deleting several in a row made it
   look like nothing was happening at all. */
async function refreshResults() {
  try {
    const res = await fetch("/api/results", { cache: "no-store" });
    if (res.ok) state.data = await res.json();
  } catch (_) { /* the poll will catch up */ }
}

const val = (id) => { const el = $("#" + id); return el ? el.value.trim() : ""; };
const num = (id) => { const v = val(id); return v === "" ? null : Number(v); };
const checked = (id) => { const el = $("#" + id); return !!(el && el.checked); };

/* --------------------------------- Setup -------------------------------- */

/* The model field, in whichever form the endpoint's catalog deserves.

   Before anything is fetched it is a plain text box, because a dropdown you
   cannot populate is worse than a field you can type into. Once the catalog is
   known the shape follows its size: a self-hosted server lists one or two
   models and gets a real <select>, while an aggregator lists hundreds and gets
   a typeahead instead -- scrolling 300 options to find one is not a choice, it
   is a chore. */
const MODEL_SELECT_MAX = 40;

function renderModelField(ep, provider) {
  const catalog = cp.models && cp.models.models ? cp.models.models : null;
  const required = provider.model_is_discoverable ? "(optional)" : "(required)";
  // Pre-select what the server actually has loaded, so a local endpoint needs
  // no decision at all.
  const current = ep.model || (cp.models ? cp.models.default : "") || "";

  const hint = provider.model_is_discoverable
    ? "A local server has one model loaded, so this is detected for you."
    : "This provider serves many models, so name the one you mean.";

  let control;
  if (!catalog || !catalog.length) {
    control = `<input type="text" id="ep-model" value="${esc(current)}"
      placeholder="${provider.model_is_discoverable
        ? "auto-detected from the server" : "e.g. qwen/qwen3-coder"}">`;
  } else if (catalog.length <= MODEL_SELECT_MAX) {
    const blank = provider.model_is_discoverable
      ? `<option value="">auto-detect (${esc(cp.models.default || "first available")})</option>`
      : `<option value="">— choose a model —</option>`;
    control = `<select id="ep-model">${blank}${catalog.map((m) => {
      const ctx = m.context_length
        ? `  ·  ${Math.round(m.context_length / 1024)}K ctx` : "";
      return `<option value="${esc(m.id)}"${m.id === current ? " selected" : ""}>`
        + `${esc(m.id)}${esc(ctx)}</option>`;
    }).join("")}</select>`;
  } else {
    control = `<input type="text" id="ep-model" list="model-options"
      value="${esc(current)}" placeholder="type to search ${catalog.length} models">
      <datalist id="model-options">${catalog.map((m) =>
        `<option value="${esc(m.id)}">${esc(m.name || "")}</option>`).join("")}</datalist>`;
  }

  const count = catalog
    ? `${catalog.length} model${catalog.length === 1 ? "" : "s"} available`
    : "not loaded yet";

  return `
    <div class="field">
      <label for="ep-model">Model id ${required}</label>
      <div style="display:flex;gap:6px;align-items:stretch">
        <div style="flex:1;min-width:0">${control}</div>
        <button class="btn" id="btn-load-models" type="button"
          ${cp.busy ? "disabled" : ""} title="Fetch the list from the endpoint">Load</button>
      </div>
      <div class="hint">${hint} <span style="color:var(--ink-muted)">(${esc(count)})</span></div>
    </div>`;
}

function renderSetup() {
  const s = cp.server;
  if (!s) return `<div class="empty">Loading&hellip;</div>`;
  const ep = s.config.endpoint;
  const provider = s.providers.find((p) => p.id === ep.provider) || s.providers[0];
  const busy = cp.busy;
  const suggested = cp.probe && cp.probe.ok
    ? (cp.probe.effective_label || cp.probe.suggested_label) : "";

  const probe = cp.probe
    ? (cp.probe.ok
        ? `<div class="note ok">Connected.<pre>${esc(cp.probe.description)}</pre>${
            cp.probe.speed
              ? `<pre>${cp.probe.speed.tokens_per_s.toFixed(1)} output tok/s  →  `
                + `suggested agent_timeout_multiplier: `
                + `${cp.probe.speed.recommended_multiplier}</pre>`
              : ""
          }${cp.probe.speed_error ? `<pre>speed: ${esc(cp.probe.speed_error)}</pre>` : ""}</div>`
        : `<div class="note bad">${esc(cp.probe.error)}</div>`)
    : "";

  return `
  ${noticeHtml("setup")}
  ${probe}
  <div class="card">
    <h2>Model endpoint <span class="sub">${esc(s.config_path)}${s.config_exists ? "" : " (not created yet)"}</span></h2>
    <div class="card-body">
      <p>Which model to benchmark. Everything here is written to a gitignored
         config file &mdash; nothing reaches source control.</p>
      <div class="cols">
        <div>
          <div class="field">
            <label for="ep-provider">Provider</label>
            <select id="ep-provider">
              ${s.providers.map((p) => `<option value="${esc(p.id)}"${p.id === ep.provider ? " selected" : ""}>${esc(p.label)}</option>`).join("")}
            </select>
            <div class="hint">Any server speaking OpenAI-compatible <code>/v1</code>
              &mdash; llama-server, vLLM, Ollama, LM Studio &mdash; or OpenRouter.</div>
          </div>
          <div class="field">
            <label for="ep-base-url">Base URL</label>
            <input type="text" id="ep-base-url" value="${esc(ep.base_url)}"
                   placeholder="${esc(provider.default_base_url)}">
            <div class="hint">Include the <code>/v1</code> suffix. Left empty this
              keeps the saved URL; type <code>clear</code> to fall back to the
              greyed-out default.</div>
          </div>
          ${renderModelField(ep, provider)}
        </div>
        <div>
          <div class="field">
            <label for="ep-key-env">API key environment variable</label>
            <input type="text" id="ep-key-env" value="${esc(ep.api_key_env)}"
                   placeholder="${esc(provider.default_api_key_env)}">
            <div class="hint">Preferred: name the variable and keep the key in your
              shell. The key never touches disk here.</div>
          </div>
          <div class="field">
            <label for="ep-key">API key ${s.api_key_set ? "(currently set)" : "(optional)"}</label>
            <input type="password" id="ep-key" value="" autocomplete="off"
                   placeholder="${s.api_key_set ? "unchanged — type to replace" : "leave empty to use the variable above"}">
            <div class="hint">Stored in the gitignored config file, written
              <code>0600</code>. Treat that file as a credential once set.
              ${s.api_key_set ? "Submit the word <code>clear</code> to remove it." : ""}</div>
          </div>
          <div class="field">
            <label for="ep-context">Context window</label>
            <input type="number" id="ep-context" min="0" max="10000000" step="1024"
                   value="${esc(ep.context_window || "")}" placeholder="0 — ask the server">
            <div class="hint">Handed to <b>every</b> harness, so none of them has to
              guess and no two guess differently. Leave at <code>0</code> and the
              server is asked: llama.cpp reports the loaded window, and that is the
              right answer. Ollama does not &mdash; it exposes only the model's
              architectural maximum, never the window the server was started with
              &mdash; so set it here to match <code>OLLAMA_CONTEXT_LENGTH</code>.
              Overshooting is the dangerous direction: the server truncates in
              silence and the run scores it as a wrong answer.</div>
          </div>
          <div class="field">
            <label for="ep-label">Display label (optional)</label>
            <input type="text" id="ep-label" value="${esc(ep.label)}"
                   placeholder="${esc(suggested || "derived from the served weights")}">
            <div class="hint">How this model is named in results and run folders.
              ${suggested
                ? `Left empty you get <code>${esc(suggested)}</code>.`
                : "Left empty it is derived from the weights filename."}
              Saving a name pins it to these weights, so it survives a server
              restart. Runs already on disk keep the name they were recorded with.</div>
          </div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-save-config" ${busy ? "disabled" : ""}>Save configuration</button>
        <button class="btn" id="btn-test" ${busy ? "disabled" : ""}>Test connection</button>
        <button class="btn" id="btn-test-speed" ${busy ? "disabled" : ""}>Test &amp; measure speed</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Storage and privacy</h2>
    <div class="card-body">
      <div class="field" style="max-width:520px">
        <label for="cfg-runs-dir">Run output directory</label>
        <input type="text" id="cfg-runs-dir" value="${esc(s.config.runs_dir)}">
        <div class="hint">Relative paths resolve against the repo root. Runs get
          large &mdash; container logs and trajectories &mdash; so point this at a
          roomy disk. Currently: <code>${esc(s.runs_dir)}</code></div>
      </div>
      <div class="check">
        <input type="checkbox" id="cfg-hostname" ${s.config.record_hostname ? "checked" : ""}>
        <div>
          <label for="cfg-hostname">Record this machine's hostname in run manifests</label>
          <div class="hint">Off by default. Manifests are what an exported snapshot
            inlines, so this puts a machine name into anything you share. Useful only
            if you compare runs across your own machines.</div>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-save-storage" ${busy ? "disabled" : ""}>Save</button>
      </div>
    </div>
  </div>`;
}

function endpointFromForm() {
  const key = val("ep-key");
  const baseUrl = val("ep-base-url");
  const endpoint = {
    provider: val("ep-provider"),
    api_key_env: val("ep-key-env"),
    model: val("ep-model"),
    label: val("ep-label"),
    context_window: val("ep-context"),
  };
  // Empty means "leave as-is"; the literal word clear means "remove it".
  if (key === "clear") endpoint.api_key = "";
  else if (key !== "") endpoint.api_key = key;
  // Same rule for the URL, because an empty box here is almost never a
  // request to unset it -- it is a reload that dropped the draft, and the
  // field renders the provider default as a *placeholder*, which reads as
  // though it were filled in. Omitting it lets the stored value stand.
  //
  // "clear" is forwarded rather than translated to "": the server treats an
  // empty base_url as "unchanged", so the sentinel has to survive the trip.
  // The key needs no such care -- nothing there reinterprets "".
  if (baseUrl !== "") endpoint.base_url = baseUrl;
  return endpoint;
}

/* Fold what is currently typed back into the in-memory state.

   Every re-render of this tab rebuilds the inputs from cp.server, so without
   this a failed save or a failed connection test would snap the form back to
   the stored configuration and discard the URL the user was trying to fix --
   at exactly the moment they need to edit it. Returns the captured endpoint so
   the caller can send precisely what it preserved.

   The key is deliberately not kept in cp.server: that object is rendered, and
   the key field is never pre-filled. */
function captureSetupDraft() {
  const endpoint = endpointFromForm();
  if (cp.server) {
    const { api_key, ...withoutKey } = endpoint;   // eslint-disable-line no-unused-vars
    cp.server.config.endpoint = { ...cp.server.config.endpoint, ...withoutKey };
    // Held separately because every action refetches /api/state on success and
    // replaces cp.server wholesale. Folding into that object alone is not
    // enough: a *successful* connection test would then snap the form back to
    // the stored configuration, and the URL being tested is exactly the one not
    // stored yet. The box would look empty, its placeholder reads as a value,
    // and the save that follows sends nothing.
    cp.setupDraft = withoutKey;
  }
  return endpoint;
}

function wireSetup() {
  const sel = $("#ep-provider");
  if (sel) sel.onchange = () => {
    captureSetupDraft();
    // The catalog and the probe belong to the provider that produced them.
    // Keeping them would offer a model list from an endpoint you just left.
    cp.models = null;
    cp.probe = null;
    if (cp.server) cp.server.config.endpoint.model = "";
    // Re-render so the hints and required-ness follow the chosen provider.
    renderTab("setup");
  };

  const save = $("#btn-save-config");
  if (save) save.onclick = () => {
    const endpoint = captureSetupDraft();
    act("setup", "save", async () => {
      const saved = await api("/api/config", { method: "POST", body: { endpoint } });
      // Stored now, so the refetched state is the truth and the draft must not
      // outlive it, or a later edit elsewhere would resurrect this one.
      cp.setupDraft = null;
      return saved;
    }, "Configuration saved.");
  };

  const storage = $("#btn-save-storage");
  if (storage) storage.onclick = () => {
    const body = {
      runs_dir: val("cfg-runs-dir"),
      record_hostname: checked("cfg-hostname"),
    };
    if (cp.server) cp.server.config.runs_dir = body.runs_dir;
    act("setup", "save", () =>
      api("/api/config", { method: "POST", body }), "Saved.");
  };

  const load = $("#btn-load-models");
  if (load) load.onclick = () => {
    const endpoint = captureSetupDraft();
    act("setup", "models", async () => {
      cp.models = await api("/api/config/models", {
        method: "POST", body: { endpoint },
      });
      // Nothing chosen yet and the server knows which model it has loaded:
      // adopt it, so a local endpoint needs no decision at all.
      if (!endpoint.model && cp.models.default && cp.server) {
        cp.server.config.endpoint.model = cp.models.default;
      }
      return cp.models;
    }, (r) => `Found ${r.models.length} model${r.models.length === 1 ? "" : "s"}.`);
  };

  const test = (speed) => {
    const endpoint = captureSetupDraft();
    act("setup", "test", async () => {
      try {
        cp.probe = await api("/api/config/test", {
          method: "POST", body: { endpoint, speed },
        });
        // The test already fetched the catalog, so choosing a model afterwards
        // costs no extra round trip.
        if (cp.probe.models && cp.probe.models.length) {
          cp.models = {
            models: cp.probe.models,
            default: cp.probe.default || "",
            discoverable: cp.probe.discoverable,
          };
        }
        // Record what the endpoint actually reported, so the dropdown shows the
        // real served model rather than staying on "auto-detect".
        if (!endpoint.model && cp.probe.identity && cp.server) {
          cp.server.config.endpoint.model = cp.probe.identity.served_id || "";
        }
      } catch (err) {
        cp.probe = { ok: false, error: String(err.message || err) };
        throw err;
      }
      return cp.probe;
    }, null);   // null: the probe panel below renders the outcome itself
  };

  const t1 = $("#btn-test"); if (t1) t1.onclick = () => test(false);
  const t2 = $("#btn-test-speed"); if (t2) t2.onclick = () => test(true);
}

/* ---------------------------------- Run --------------------------------- */

function renderRun() {
  const s = cp.server;
  if (!s) return `<div class="empty">Loading&hellip;</div>`;
  const job = s.supervisor.job;
  const active = s.supervisor.active;
  const d = s.defaults || {};
  const ids = harnessIdsSorted(s.harnesses);

  const status = job ? job.status : "idle";
  const bar = `
    <div class="runbar">
      <span class="state ${esc(status)}">${esc(status)}</span>
      ${job ? `<span>${esc(job.kind)}${job.harnesses && job.harnesses.length
        ? " · " + esc(job.harnesses.join(", ")) : ""}</span>
        <span>started ${esc(shortTime(job.started_at))}</span>
        ${job.returncode != null ? `<span>exit ${job.returncode}</span>` : ""}
        ${job.stopped_reason ? `<span>${esc(job.stopped_reason)}</span>` : ""}`
        : `<span>nothing running</span>`}
      <span style="flex:1"></span>
      ${active ? `<button class="btn danger" id="btn-stop">Stop</button>` : ""}
    </div>`;

  // The benchmark decides what a subset means, so it is resolved before the
  // subset control is drawn rather than left to the change handler: a subset
  // belonging to another dataset selects task names that do not exist there,
  // and the run finishes having measured nothing. `null` means the subset
  // declares no benchmark, which is every subset written before subsets had to.
  const chosenDataset = (s.defaults || {}).dataset || "";
  const subsetOf = s.subset_datasets || {};

  // The single most consequential fact about a run -- which weights, at which
  // endpoint -- was nowhere on the page that launches it, while the results
  // view treats the model as its primary scope. Named here and in the confirm
  // dialog, because pointing the rig at the wrong server is otherwise only
  // discoverable from the run's manifest hours later.
  const ep = (s.config || {}).endpoint || {};
  const who = esc(ep.label || ep.model || "model auto-detected at the endpoint");

  return `
  ${noticeHtml("run")}
  ${bar}
  <div class="card">
    <h2>Start a benchmark
      <span class="sub">${who} &middot; ${esc(ep.base_url || "no endpoint configured")}</span></h2>
    <div class="card-body">
      <p>Runs are sequential by design: one endpoint backs every harness, so two
         at once would each measure the other's queueing delay as its own latency.
         Only one can be active.</p>

      <div class="group">
        <h3>What to measure</h3>
        <div class="field">
          <label for="run-dataset">Benchmark</label>
          <select id="run-dataset">
            ${(s.datasets || []).map((ds) => {
              const id = esc(ds.id);
              const sel = ds.id === chosenDataset ? " selected" : "";
              const count = ds.tasks ? ` (${ds.tasks} tasks)` : "";
              return `<option value="${id}"${sel}>${esc(ds.label || ds.id)}${count}</option>`;
            }).join("") || `<option value="">catalog default</option>`}
          </select>
        </div>
        <fieldset>
          <legend>Harnesses <span style="text-transform:none;letter-spacing:0;color:var(--ink-muted)">(none selected = all)</span></legend>
          ${ids.length ? ids.map((id) => `
            <div class="check">
              <input type="checkbox" id="h-${esc(id)}" data-harness-pick="${esc(id)}">
              <label for="h-${esc(id)}">${esc(s.harnesses[id].label || id)}
                <span style="color:var(--ink-muted)">${esc(id)}</span></label>
            </div>`).join("")
          : `<div class="note warn">No harnesses defined. Add one on the Harnesses tab.</div>`}
        </fieldset>
      </div>

      <div class="group">
        <h3>How much of it</h3>
        <!-- Three exclusive answers as one radio group, rather than two
             independent controls with the word "or" in a label. They were never
             exclusive: runSpecFromForm sent the subset and the task cap
             together when both were filled, the runner honoured both, and the
             confirm dialog named only the subset -- so a run could be launched
             reading "subset stratified-25", quietly capped at 5 tasks, and then
             recorded under the subset's name, where the results view would pair
             it against real subset runs. -->
        <div class="scope" role="radiogroup" aria-label="How much of the benchmark to run">
          <label class="scope-opt">
            <input type="radio" name="run-scope" value="full" checked>
            <span>Full benchmark</span>
            <span class="why" id="scope-full-n"></span>
          </label>
          <label class="scope-opt">
            <input type="radio" name="run-scope" value="subset">
            <span>Named subset</span>
            <select id="run-subset" aria-label="Which subset" disabled>
              ${(s.subsets || []).map((n) => {
                // Disabled and labelled with the benchmark it belongs to, not
                // dropped: a subset that vanishes when you change benchmark is
                // a worse puzzle than one that is greyed out and says why.
                // Carried in the markup so the state can be recomputed when the
                // benchmark changes, which does not re-render this form.
                const owner = subsetOf[n] || "";
                const fits = !owner || !chosenDataset || owner === chosenDataset;
                return `<option value="${esc(n)}" data-subset-dataset="${esc(owner)}"${
                  fits ? "" : " disabled"}>${esc(n)}${fits ? "" : ` — ${esc(owner)} only`}</option>`;
              }).join("") || `<option value="">none defined</option>`}
            </select>
            <span class="why" id="run-subset-why"></span>
          </label>
          <label class="scope-opt">
            <input type="radio" name="run-scope" value="ntasks">
            <span>First</span>
            <input type="number" id="run-ntasks" min="1" max="1000" value="5"
                   disabled aria-label="How many tasks">
            <span>tasks</span>
            <span class="why">recorded as a smoke test</span>
          </label>
        </div>
        <div class="hint">
          A subset is a list of task names, so it only means anything on the
          benchmark it was drawn from &mdash; one built for another is greyed out
          rather than hidden, and the runner refuses the pairing too. A subset run
          is comparable only against other runs of the same subset at the same
          multiplier; the results view refuses to pair anything else.
        </div>
      </div>

      <div class="group">
        <h3>How hard to push <span class="sub">these change what the run measures</span></h3>
        <div class="row">
          <div class="field">
            <label for="run-mult">Timeout multiplier</label>

                   value="${esc(d.agent_timeout_multiplier ?? 16)}">
          </div>
          <div class="field">
            <label for="run-conc">Trials in flight</label>
            <input type="number" id="run-conc" min="1" max="32" value="${esc(d.n_concurrent ?? 2)}">
          </div>
          <div class="field">
            <label for="run-agents">Generating at once</label>
            <input type="number" id="run-agents" min="1" max="32" value="${esc(d.n_concurrent_agents ?? 1)}">
          </div>
        </div>
        <div class="hint">
          Keep “generating at once” at your server's slot count, or requests queue and
          the penalty lands hardest on whichever harness makes more calls &mdash; the
          variable under test. A run at a different multiplier is a different
          experiment and will not be paired against this one.
        </div>
        <div class="note warn" id="run-conc-warn" style="display:none;margin-top:6px"></div>
      </div>

      <div class="group">
        <h3>What to record</h3>
      <div class="check">
        <input type="checkbox" id="run-allow-hosts">
        <div>
          <label for="run-allow-hosts">Send the egress allowlist</label>
          <div class="hint">Only for datasets that restrict network access during the
            agent phase. Terminal-Bench 2 does not; check your dataset before
            enabling it.</div>
        </div>
      </div>
      ${(() => {
        // This page is re-read from disk on every request; the server process is
        // not. A dashboard left running across an upgrade would render this box,
        // send the flag, and have it silently ignored -- which is exactly how a
        // run gets started believing it is recording evidence that it is not.
        const supported = can("debug_capture");
        return `
      <div class="check" style="margin-top:10px">
        <input type="checkbox" id="run-debug" ${cp.debugCapture && supported ? "checked" : ""}

            harnesses for connection-level logs where they support it. Read-only and
            takes no generation slot &mdash; but without it, a trial that dies on a
            transport error cannot be attributed afterwards, and "the endpoint
            dropped" becomes an assumption rather than a finding.</div>
          ${supported ? "" : `<div class="note warn" style="margin-top:6px">
            The running dashboard predates this option and would ignore it.
            <b>Restart the dashboard</b>, then start the run &mdash; otherwise it
            records nothing and the failures stay unattributable.</div>`}
        </div>
      </div>`;
      })()}

      <div class="btn-row">
        <button class="btn primary" id="btn-start" ${active || cp.busy || !ids.length ? "disabled" : ""}>Start benchmark</button>
        <button class="btn" id="btn-dry" ${active || cp.busy ? "disabled" : ""}>Preview command</button>
        ${active ? `<span style="color:var(--ink-muted);font-size:11px">stop the current run to start another</span>` : ""}
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Live output <span class="sub">${cp.log.length} lines</span></h2>
    <div class="card-body">
