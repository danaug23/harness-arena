<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>harness-arena // terminal-bench harness matrix</title>
<style>
/* ---------------------------------------------------------------------------
   Design tokens.

   Categorical slots are the validated dark-mode order (validate_palette.js,
   surface #080b0f: lightness band, chroma floor, adjacent CVD dE 8.4, normal
   vision dE 19.3, contrast -- all PASS). Do not reorder: the ordering IS the
   colorblind-safety mechanism.

   Status slots are the fixed status palette. They deliberately fail the
   categorical checks (deutan good-vs-critical dE 4.1), which is why every
   status mark on this page also carries a glyph and a text label.

   Typeface is the one parameter substituted from the reference: this is a
   terminal-themed surface, so the "system face" here is monospace.
--------------------------------------------------------------------------- */
:root {
  color-scheme: dark;

  --plane:        #05070a;
  --surface:      #080b0f;
  --surface-2:    #0c1116;
  --surface-3:    #111820;

  --ink:          #e8f5ee;
  --ink-2:        #9fb5a9;
  --ink-muted:    #66796f;

  /* Matrix phosphor. Chrome only -- headings, rules, borders. Never a data
     mark, so it cannot be mistaken for a series or a status. */
  --phosphor:     #00ff41;
  --phosphor-dim: #22cc55;

  --grid:         rgba(0, 255, 65, 0.09);
  --rule:         rgba(0, 255, 65, 0.17);
  --baseline:     rgba(0, 255, 65, 0.30);
  --hairline:     rgba(232, 245, 238, 0.10);

  --s1: #3987e5;  --s2: #d95926;  --s3: #199e70;  --s4: #c98500;
  --s5: #d55181;  --s6: #008300;  --s7: #9085e9;  --s8: #e66767;

  --good:     #0ca30c;
  --warning:  #fab219;
  --serious:  #ec835a;
  --critical: #d03b3b;

  --mono: ui-monospace, "JetBrains Mono", "Cascadia Code", "SF Mono", Menlo,
          Consolas, "DejaVu Sans Mono", monospace;

  --gap: 2px;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--plane);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

body::before {
  /* Scanlines. Fixed, non-interactive, and faint enough to stay under data. */
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  background: repeating-linear-gradient(
    to bottom,
    rgba(0, 255, 65, 0.020) 0px,
    rgba(0, 255, 65, 0.020) 1px,
    transparent 1px,
    transparent 3px
  );
}

a { color: var(--phosphor-dim); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ---------------------------- page shell --------------------------------
   The whole dashboard is one viewport-height flex column: fixed header, fixed
   filter strip, and a grid that consumes the rest. Panels scroll *internally*
   rather than the page scrolling, so nothing important is ever below the fold.
   Below 1180px this unwinds into the ordinary stacked document.            */

html, body { height: 100%; }
body { display: flex; flex-direction: column; overflow: hidden; }

.wrap {
  flex: 1;
  min-height: 0;                 /* lets the grid shrink instead of overflowing */
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-width: 1800px;
  width: 100%;
  margin: 0 auto;
  padding: 10px 16px 12px;
}

/* ------------------------------- header --------------------------------- */

header {
  position: relative;
  flex: none;
  border-bottom: 1px solid var(--rule);
  background: var(--surface);
}
.head-inner {
  position: relative;
  z-index: 1;
  max-width: 1800px;
  margin: 0 auto;
  padding: 9px 16px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 18px;
  justify-content: space-between;
}
.brand { display: flex; align-items: baseline; gap: 14px; min-width: 0; }
h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--phosphor);
  text-shadow: 0 0 16px rgba(0, 255, 65, 0.4);
  white-space: nowrap;
}
.tagline {
  margin: 0;
  color: var(--ink-muted);
  font-size: 11.5px;
  letter-spacing: 0.03em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.live {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  padding: 6px 13px;
  border: 1px solid var(--rule);
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
.live.on .dot { background: var(--good); box-shadow: 0 0 10px var(--good); animation: pulse 1.6s ease-in-out infinite; }
.live.on { color: var(--ink); border-color: rgba(12, 163, 12, 0.45); }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

/* ------------------------------- filters -------------------------------- */
/* One filter row above everything it scopes; every panel re-renders together. */

/* The filter block sits *inside* the grid, in the first column above the feed,
   so it is as wide as one panel rather than the whole page. That is the whole
   point of it: as a full-width strip it took a band of height off the top of
   every column, and the two panels that most need height -- pass rate and the
   task matrix -- were the ones paying for it. Here they start at the very top
   and the strip costs only the feed's column.

   Which in turn is why the controls stack rather than sitting on one line:
   there is no longer a page's width to spread across. */
.filters {
  grid-area: var(--area, head);
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 9px;
  padding: 8px 12px;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  background: var(--surface);
  overflow: auto;
}
.filter-row { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 14px; }
.filters .spacer { flex: 1 1 auto; }
/* The model and benchmark names are long and the column is narrow, so let the
   controls take the width they have rather than pushing the row wider than the
   panel. */
.filters select#model-select,
.filters select#dataset-select { width: 100%; min-width: 0; }
.filters .filter-group { min-width: 0; }
.filter-group { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
.filter-label {
  color: var(--ink-muted);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}
select, button.ghost {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
  background: var(--surface-3);
  border: 1px solid var(--hairline);
  border-radius: 4px;
  padding: 6px 10px;
  cursor: pointer;
}
select:focus-visible, button:focus-visible, .chip:focus-visible {
  outline: 2px solid var(--phosphor-dim);
  outline-offset: 2px;
}
.picker { position: relative; }
.picker-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: 40;
  min-width: 320px; max-height: 420px; overflow: auto;
  padding: 8px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
}
.picker-menu[hidden] { display: none; }
.picker-actions { display: flex; gap: 8px; padding: 2px 4px 8px; }
.pick-group + .pick-group { margin-top: 8px; border-top: 1px solid var(--hairline); padding-top: 8px; }
.pick-head, .pick-row {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 6px; border: 0; border-radius: 5px;
  background: none; color: var(--ink-2); font: inherit; font-size: 11.5px;
  text-align: left; cursor: pointer;
}
.pick-head { color: var(--ink); font-weight: 600; text-transform: lowercase; }
.pick-head:hover, .pick-row:hover { background: var(--surface-3); }
.pick-when { font-variant-numeric: tabular-nums; color: var(--ink-muted); min-width: 96px; }
.pick-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pick-box {
  flex: none; width: 12px; height: 12px; border-radius: 3px;
  border: 1px solid var(--ink-muted);
}
.pick-box.on   { background: var(--good); border-color: var(--good); }
/* Partly selected: unmistakably not the same as on or off at a glance. */
.pick-box.some { background: linear-gradient(135deg, var(--good) 50%, transparent 50%); }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  min-height: 24px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-2);
  font-size: 12.5px;
  cursor: pointer;
  user-select: none;
}
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--rule); background: var(--surface-2); }
.chip[aria-pressed="false"] { opacity: 0.44; }
.swatch { width: 10px; height: 10px; border-radius: 2px; flex: none; }

/* ------------------------------ expanded ---------------------------------
   Six panels on one screen means every one of them is small, and the two that
   hold the most -- the task matrix at 89 rows and the run log -- are the ones
   that suffer. This gives any panel the whole window on demand, without
   changing what it is: the expanded copy is the same rendered panel, so it
   keeps updating on the five-second poll while it is open.               */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.72);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2vh 2vw;
  z-index: 50;
}
.modal-backdrop > .panel {
  width: 96vw;
  height: 96vh;
  max-width: none;
  /* The grid places panels by area; this one is out of the grid entirely. */
  grid-area: auto;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
  border-color: var(--rule);
}
/* The body is the part that gains: it takes every pixel the window can spare,
   and scrolls when the content still exceeds it. `height: auto` overrides the
   narrow-viewport rule that pins the feed body to 55vh -- in here the window is
   the only limit. */
.modal-backdrop > .panel > .panel-body {
  flex: 1 1 auto; max-height: none; height: auto; overflow: auto;
}
/* The feed brings its own scroller (`.feed`), and it is the one the
   stick-to-newest logic drives. A second scroller on the body would leave that
   logic moving an element the reader is not looking through. */
.modal-backdrop > .panel.feed-panel > .panel-body { overflow: hidden; }
.modal-backdrop .panel-expand { display: none; }
.modal-close {
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1;
  color: var(--ink-2);
  background: var(--surface-3);
  border: 1px solid var(--hairline);
  border-radius: 3px;
  padding: 4px 9px;
  cursor: pointer;
}
.modal-close:hover { color: var(--ink); border-color: var(--rule); }
.panel-expand { padding: 3px 7px; line-height: 1; }

/* A filter that hides data has to look switched on, and a chip could not do
   that job: its only "on" signal was looking *less* dim than its "off" state,
   so an active filter read as an ordinary button and a run vanished with
   nothing on screen saying why. This one states it four ways -- a filled box,
   a check glyph, the label, and a count of what is being hidden -- because the
   failure it caused was silent, and because colour alone is not a signal
   everyone receives.

   Scoped to `.filters`, which is the only place it was ever meant for. Unscoped
   it also matched every checkbox on the Run, Setup and Harness forms, and the
   plain `.check` further down only overrode four of its declarations -- so the
   pill's padding, border, 999px radius, background and checked-state colour
   change all still landed on them. A harness row with a two-line explanation
   under it was being drawn inside a pill built for a one-word chip, and the
   `accent-color` on the form rule never applied because `appearance: none`
   here had already replaced the native control. */
.filters .check {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  min-height: 24px;
  border: 1px solid var(--hairline);
  border-radius: 999px;
  background: var(--surface-3);
  color: var(--ink-2);
  font-size: 12.5px;
  cursor: pointer;
  user-select: none;
}
.filters .check input {
  appearance: none;
  -webkit-appearance: none;
  width: 13px;
  height: 13px;
  margin: 0;
  flex: none;
  border: 1px solid var(--ink-muted);
  border-radius: 3px;
  background: var(--surface);
  display: grid;
  place-content: center;
  cursor: pointer;
}
/* Phosphor is chrome here, not a data mark, so it cannot be mistaken for a
   series or a status. */
.filters .filters .check input:checked { background: var(--phosphor); border-color: var(--phosphor); }
.filters .check input::after {
  content: "\2713";
  font-size: 11px;
  line-height: 1;
  color: var(--plane);
  opacity: 0;
}
.filters .filters .check input:checked::after { opacity: 1; }
/* Enhancement only: the box above already carries the state on its own, so a
   browser without :has() still shows a checked filter as checked. */
.filters .check:has(input:checked) {
  color: var(--ink);
  border-color: var(--rule);
  background: var(--surface-2);
}
.filters .check .count {
  color: var(--phosphor-dim);
  font-variant-numeric: tabular-nums;
}

/* -------------------------------- tiles --------------------------------- */

/* Headline numbers ride in the filter strip rather than owning a row of their
   own -- four values do not need 130px of vertical space. */
.tiles { display: flex; gap: 18px; flex-wrap: wrap; align-items: stretch; }
.tile {
  border-left: 2px solid var(--phosphor-dim);
  padding: 1px 0 1px 10px;
  min-width: 104px;
}
.tile .k {
  color: var(--ink-muted);
  font-size: 9.5px;
  letter-spacing: 0.13em;
  text-transform: uppercase;
}
.tile .v {
  font-size: 19px; font-weight: 700; color: var(--ink);
  line-height: 1.25; margin-top: 1px;
}
.tile .sub { color: var(--ink-muted); font-size: 10.5px; }

/* ------------------------------- panels --------------------------------- */

/* ------------------------------ the grid --------------------------------
   Six panels on one screen. The feed and the task matrix are the two that
   genuinely need height, so they get full-height columns; the summary panels
   stack in the middle; the run log is a short full-width strip.
   Area names stay constant so a panel keeps its identity when the feed is
   absent and the layout re-flows.                                          */

.grid {
  flex: 1;
  min-height: 0;
  display: grid;
  gap: 10px;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) minmax(0, 1.05fr);
  /* Every content row takes an equal share, and the panels scroll.
     Pass rate used to size to its content, on the reasoning that one short row
     per harness would leave a stretched panel mostly empty. That holds for two
     or three runs; at five -- each carrying a partial-credit line -- it grew
     past 500px, and because it shares row 1 with the model filters it set the
     height of both and squeezed everything underneath into a strip too short
     to read. A panel that has more to show than fits is the normal case here,
     so they scroll rather than push their neighbours off the screen. */
  /* Row 1 carries the model panel, which has a fixed amount to say -- a select,
     four tiles, the harness chips and the run controls -- and clips rather than
     scrolling gracefully when it is short. It takes the larger share; pass rate
     sits beside it and scrolls, which it does not mind. */
  grid-template-rows:
    minmax(0, 1.35fr) minmax(0, 1fr) minmax(0, 1fr) minmax(80px, auto);
  /* `head` is the filter block. It occupies one column instead of a full-width
     band, so the matrix and the pass rate begin at the top of the page and keep
     the height the strip used to take from every column at once.

     Every name here has to stay a *rectangle*: an invalid grid-template-areas
     is dropped whole and silently, taking the layout with it. */
  grid-template-areas:
    "head rate matrix"
    "feed eff  matrix"
    "feed cost matrix"
    "log  log  log";
}
.grid[data-feed="off"] {
  /* No feed column to fill, so the two cost panels take the width of the left
     two columns rather than leaving a gap where the feed was. */
  grid-template-areas:
    "head rate matrix"
    "eff  eff  matrix"
    "cost cost matrix"
    "log  log  log";
}

section.panel {
  grid-area: var(--area);
  display: flex;
  flex-direction: column;
  min-height: 0;                 /* without this the body cannot scroll */
  min-width: 0;
  border: 1px solid var(--hairline);
  border-radius: 6px;
  background: var(--surface);
  overflow: hidden;
}
.panel-head {
  flex: none;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 7px 11px;
  border-bottom: 1px solid var(--hairline);
}
.panel-head h2 {
  margin: 0;
  font-size: 10.5px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--phosphor-dim);
  white-space: nowrap;
}
.panel-head .note {
  color: var(--ink-muted);
  font-size: 10.5px;
  text-align: right;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  min-width: 0;
}
.panel-body {
  flex: 1;
  min-height: 0;
  padding: 11px;
  overflow: auto;
}

.toggle-view {
  font-size: 9.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  padding: 3px 8px;
  flex: none;
}

/* ----------------------------- leaderboard ------------------------------ */

.lb { display: grid; gap: 9px; min-width: 0; }
/* Name over bar rather than beside it: at this column width a side-by-side
   layout squeezed the label into two cramped lines and left the bar stubby. */
.lb-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; }
.lb-name {
  display: flex; align-items: center; gap: 6px; min-width: 0;
  grid-column: 1; grid-row: 1;
}
.lb-row .lb-track { grid-column: 1 / -1; grid-row: 2; }
.lb-row .lb-val { grid-column: 2; grid-row: 1; }
.lb-name .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb-name .mdl { color: var(--ink-muted); font-size: 11px; }
.lb-track { position: relative; height: 20px; min-width: 0; }
.lb-grid { position: absolute; inset: 0; }
.lb-grid i {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--grid);
}
.lb-bar {
  position: absolute; top: 5px; height: 9px;
  border-radius: 0 4px 4px 0;   /* rounded data-end, anchored at the baseline */
  left: 0;
}
.lb-ci {
  position: absolute; top: 8.5px; height: 2px;
  background: rgba(232, 245, 238, 0.55);
}
.lb-ci::before, .lb-ci::after {
  content: ""; position: absolute; top: -4px; width: 2px; height: 10px;
  background: rgba(232, 245, 238, 0.55);
}
.lb-ci::before { left: 0; } .lb-ci::after { right: 0; }
.lb-val {
  text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
  display: flex; align-items: baseline; gap: 6px;
}
.lb-val .pct { font-size: 15px; font-weight: 700; }
.lb-val .of { color: var(--ink-muted); font-size: 10px; }

/* Partial credit. Deliberately quiet and set apart from the pass rate: it is a
   different measurement, not a second opinion on the same one, and it must
   never be mistaken for the score. */
.lb-checks {
  margin-left: 10px; padding-left: 10px;
  border-left: 1px solid var(--hairline);
  color: var(--ink-muted); font-size: 10px; line-height: 1.35;
  text-align: right; white-space: nowrap;
}
.lb-checks b { color: var(--ink-2); font-weight: 600; }
/* The all-inclusive total is context, not the headline: quieter so the eye
   lands on the partial credit, which is the part the pass rate has not said. */
.lb-checks-all { color: var(--ink-muted); }
.axis-row { color: var(--ink-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
.axis-ticks { position: relative; height: 12px; }
.axis-ticks span { position: absolute; transform: translateX(-50%); }

/* ------------------------------- matrix --------------------------------- */

.mx { border-collapse: separate; border-spacing: 0; font-size: 11px; width: 100%; }
.mx th, .mx td { padding: 0; }
.mx thead th {
  position: sticky; top: -11px; z-index: 3;  /* -11px cancels .panel-body padding */
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 5px 4px;
  font-weight: 600;
  color: var(--ink-2);
  text-align: center;
  vertical-align: bottom;
  white-space: nowrap;
  font-size: 10px;
}
.mx thead th.task-col, .mx tbody th {
  position: sticky; left: -11px; z-index: 2;
  background: var(--surface);
  text-align: left;
  padding: 2px 8px 2px 4px;
  font-weight: 400;
  color: var(--ink-2);
  white-space: nowrap;
  max-width: 210px; overflow: hidden; text-overflow: ellipsis;
  border-right: 1px solid var(--hairline);
  font-size: 10.5px;
}
.mx thead th.task-col { z-index: 4; }
.mx tbody tr:hover th { color: var(--ink); }
.cell-wrap { padding: var(--gap); }       /* the 2px surface gap between fills */
.cell {
  display: flex; align-items: center; justify-content: center;
  width: 100%; min-width: 34px; height: 17px;
  border-radius: 3px;
  font-size: 9.5px; font-weight: 700;
  font-variant-numeric: tabular-nums;
  cursor: default;
}
.cell.pass    { background: rgba(12, 163, 12, 0.24);  color: #4fe07a; }
.cell.fail    { background: rgba(232, 245, 238, 0.05); color: var(--ink-muted); }
/* Half the checks or better: a near miss, not a blank. Brighter ink so the
   "almost" cases stand out from the total failures at a glance. */
.cell.fail.near { background: rgba(250, 178, 25, 0.12); color: #c9a24a; }
.cell.error   { background: rgba(208, 59, 59, 0.22);  color: #f08a8a; }
.cell.timeout { background: rgba(250, 178, 25, 0.20); color: #f6c657; }
/* Passed, but the agent was killed at the time limit. Still a pass -- the amber
   underline just flags that it was finishing on borrowed time. */
.cell.pass.late { box-shadow: inset 0 -2px 0 0 var(--warning); }
.cell.pending { background: transparent; color: rgba(232, 245, 238, 0.14); }
/* Deliberately cool and quiet: an unscored trial is not a result. It must not
   read as a near-miss (warm) or a fault (red) at a glance across the grid. */
.cell.unscored { background: rgba(122, 162, 201, 0.16); color: #7aa2c9; }
.mx-legend {
  /* Above both sticky headers: the task-name column is sticky at z-index 2 and
     would otherwise paint over the legend as rows scroll past under it, eating
     the first words of each entry and letting task names bleed through. */
  position: sticky; bottom: -11px; z-index: 5;
  display: flex; flex-wrap: wrap; gap: 4px 14px;
  margin-top: 10px; padding-top: 8px;
  /* Pays back the panel's 11px, which `bottom: -11px` pulled the legend into.
     Without it the last line sits in the padding with no background under it. */
  padding-bottom: 11px;
  border-top: 1px solid var(--hairline);
  background: var(--surface);
  color: var(--ink-muted); font-size: 10px;
}
.mx-legend b { font-weight: 700; }


/* ------------------------------ scatter --------------------------------- */

.scatter { position: relative; }
.scatter svg { display: block; width: 100%; height: auto; }
.sc-label { font-size: 11px; fill: var(--ink-2); }
.sc-axis  { font-size: 10.5px; fill: var(--ink-muted); }

/* ------------------------------- tables --------------------------------- */

/* The run log's rows scroll inside the panel rather than growing it -- see
   sizeRunLog. Its own scroller, not the panel body, so the panel's padding and
   the sticky header stay put while the rows move under them. */
.log-scroll { overflow-y: auto; overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: 11px; }
table.data th {
  position: sticky; top: -11px; z-index: 2; background: var(--surface);
  text-align: left; padding: 5px 9px;
  color: var(--ink-muted); font-weight: 600;
  font-size: 9.5px; letter-spacing: 0.09em; text-transform: uppercase;
  border-bottom: 1px solid var(--rule); white-space: nowrap;
}
table.data td {
  padding: 5px 9px; border-bottom: 1px solid var(--hairline);
  font-variant-numeric: tabular-nums; vertical-align: top;
}
table.data tr:last-child td { border-bottom: none; }
table.data tr:hover td { background: var(--surface-2); }
.num { text-align: right; }
.status-pill {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
}
.status-pill.running { color: var(--warning); }
.status-pill.complete { color: var(--ink-2); }
.status-pill.stopped { color: var(--serious); }
.mono-dim { color: var(--ink-muted); font-size: 11px; word-break: break-all; }
.badge {
  display: inline-block;
  padding: 1px 6px;
  border: 1px solid var(--warning);
  border-radius: 3px;
  color: var(--warning);
  font-size: 9.5px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  vertical-align: 1px;
}
.badge-subset { border-color: var(--phosphor-dim); color: var(--phosphor-dim); }

/* ------------------------------ live feed ------------------------------- */

/* The feed panel is itself a flex column so the scroller fills whatever is
   left after the meta line and the (conditional) explanation note. */
.panel.feed-panel .panel-body { display: flex; flex-direction: column; gap: 8px; padding: 9px; }
.feed-meta {
  flex: none;
  display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center;
  color: var(--ink-2); font-size: 11.5px;
}
.feed-meta b { color: var(--ink); font-weight: 700; }
.feed-quiet { color: var(--warning); }
.feed-note {
  flex: none;
  padding: 6px 9px;
  border-left: 2px solid var(--warning);
  background: rgba(250, 178, 25, 0.07);
  color: var(--ink-muted); font-size: 10.5px; line-height: 1.5;
}
.feed {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  background: #05080b;
  border: 1px solid var(--hairline); border-radius: 5px;
  padding: 10px 12px;
}
.feed-entry { margin-bottom: 8px; display: flex; gap: 8px; align-items: flex-start; }
.feed-entry:last-child { margin-bottom: 0; }
.feed-tag {
  flex: none; width: 50px; padding-top: 1px;
  font-size: 8.5px; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-muted); text-align: right;
}
.feed-text {
  flex: 1; min-width: 0;
  white-space: pre-wrap; overflow-wrap: anywhere;
  color: var(--ink-2); font-size: 11.5px; line-height: 1.55;
}
.feed-entry.tool   .feed-tag { color: var(--s1); }
.feed-entry.tool   .feed-text { color: var(--ink); }
.feed-entry.result .feed-text { color: var(--ink-muted); }
.feed-entry.meta   .feed-text { color: var(--ink-muted); font-style: italic; }
.feed-entry:last-child .feed-text { color: var(--ink); }
.feed-cursor {
  display: inline-block; width: 7px; height: 13px;
  background: var(--phosphor); vertical-align: -2px; margin-left: 3px;
  animation: blink 1.1s step-end infinite;
}
@keyframes blink { 50% { opacity: 0; } }

/* ------------------------------ tooltip --------------------------------- */

#tip {
  position: fixed; z-index: 50; pointer-events: none;
  padding: 9px 12px; max-width: 340px;
  background: #05080b; border: 1px solid var(--rule); border-radius: 5px;
  box-shadow: 0 10px 34px rgba(0, 0, 0, 0.75);
  font-size: 12px; color: var(--ink); line-height: 1.5;
  opacity: 0; transition: opacity 0.1s;
}
#tip.on { opacity: 1; }
#tip .t-h { color: var(--phosphor-dim); font-weight: 700; margin-bottom: 4px; }
#tip .t-r { color: var(--ink-2); }
#tip .t-r b { color: var(--ink); font-weight: 700; }
/* A captured exception, as written. `pre-wrap` because the elision marker and
   the agent's own line breaks are the structure -- reflowed into a paragraph
   it becomes the wall of text this was meant to replace. Bounded so a long
   capture cannot grow the tooltip past the viewport; the run's own files hold
   the untruncated version. */
#tip .err-msg {
  margin-top: 3px;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 190px;
  overflow: hidden;
  border-left: 2px solid var(--hairline);
  padding-left: 7px;
}
#tip .t-checks {
  margin: 5px 0;
  padding: 5px 0;
  border-top: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
}
#tip .t-chk { color: var(--ink-2); font-size: 11.5px; line-height: 1.5; }
#tip .t-chk .ok { color: #4fe07a; font-weight: 700; }
#tip .t-chk .no { color: #f08a8a; font-weight: 700; }

/* ------------------------------- misc ----------------------------------- */

#app {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  transition: opacity 0.18s;                 /* hold the last render on refetch */
}
#app.stale { opacity: 0.55; }
.empty {
  height: 100%; display: flex; align-items: center; justify-content: center;
  padding: 12px; text-align: center; color: var(--ink-muted); font-size: 11.5px;
}
.empty code { color: var(--phosphor-dim); }
.hidden { display: none !important; }
footer {
  flex: none;
  color: var(--ink-muted); font-size: 10px; text-align: center; padding-top: 2px;
}

/* Narrow viewports get the ordinary stacked document back -- a three-column
   grid at 900px would be six unreadable slivers. */
@media (max-width: 1180px), (max-height: 620px) {
  body { overflow: auto; }
  .wrap { max-width: 1440px; }
  .grid, .grid[data-feed="off"] {
    grid-template-columns: minmax(0, 1fr);
    grid-template-rows: none;
    grid-template-areas: none;
  }
  section.panel, .filters { grid-area: auto; }
  /* Back to a full-width strip: in one column there is no narrow column to fit,
     and stacking the controls would just make the header tall for no gain. */
  .filters { flex-direction: row; flex-wrap: wrap; align-items: center; gap: 8px 18px; }
  .filters select#model-select,
  .filters select#dataset-select { width: auto; }
  .panel-body { max-height: 60vh; }
  .panel.feed-panel .panel-body { height: 55vh; max-height: none; }
}

@media (prefers-reduced-motion: reduce) {
  .live.on .dot { animation: none; }
  * { transition: none !important; }
}

/* =========================== control plane ==============================
   Tabs and forms for configuring, launching and maintaining runs. The
   Results tab keeps the fixed single-screen grid; every other tab is an
   ordinary scrolling document, because a form that cannot scroll is a form
   with fields you cannot reach.
------------------------------------------------------------------------- */

.tabs {
  flex: none;
  display: flex; gap: 2px; align-items: stretch;
  border-bottom: 1px solid var(--rule);
  margin-bottom: 8px;
  /* The horizontal scroll is deliberate: the tab row has to survive a narrow
     window. The vertical axis is not -- setting overflow on one axis makes the
     other compute to `auto` rather than staying `visible`, so a fraction of a
     pixel of height overflow was enough to put a scrollbar on a strip of five
     buttons. Pin it shut; nothing here is ever taller than the row. */
  overflow-x: auto;
  overflow-y: hidden;
}
.tabs button {
  appearance: none;
  background: transparent; border: 1px solid transparent; border-bottom: none;
  color: var(--ink-muted);
  font: inherit; font-size: 11.5px; letter-spacing: 0.08em; text-transform: uppercase;
  padding: 7px 14px; cursor: pointer; white-space: nowrap;
  border-radius: 3px 3px 0 0;
}
.tabs button:hover { color: var(--ink-2); background: var(--surface-2); }
.tabs button[aria-selected="true"] {
  color: var(--phosphor); background: var(--surface);
  border-color: var(--rule); border-bottom: 1px solid var(--surface);
  margin-bottom: -1px;
}
.tabs .tab-flag {
  margin-left: 7px; padding: 1px 5px; border-radius: 2px;
  font-size: 9.5px; background: var(--surface-3); color: var(--ink-2);
}
.tabs .tab-flag.live { background: var(--phosphor); color: #000; font-weight: 700; }

.tabpane { display: none; min-height: 0; }
.tabpane.on { display: flex; flex-direction: column; flex: 1; min-height: 0; }
.tabpane.doc { display: none; }
.tabpane.doc.on { display: block; flex: 1; overflow-y: auto; padding-bottom: 40px; }

/* ------------------------------- cards ---------------------------------- */

.card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 3px; margin-bottom: 10px;
}
.card > h2 {
  margin: 0; padding: 8px 12px;
  font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--phosphor-dim); font-weight: 700;
  border-bottom: 1px solid var(--rule);
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.card > h2 .sub {
  font-size: 10px; letter-spacing: 0; text-transform: none;
  color: var(--ink-muted); font-weight: 400;
}
.card-body { padding: 12px; }
.card-body > p {
  margin: 0 0 10px; color: var(--ink-2); font-size: 11.5px; max-width: 78ch;
}
.card-body > p.why {
  border-left: 2px solid var(--rule); padding-left: 9px; color: var(--ink-muted);
}
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }

/* A named step inside a form card.

   The Run form is a sequence -- what to measure, how much of it, how hard to
   push, what to record -- and it had no breaks in it, so it read as one wall of
   controls ordered by when each was added rather than by when you need it. That
   showed most after the benchmark selector arrived: it landed in the row beside
   "task subset" and "timeout multiplier", which put the thing being measured,
   the amount of it, and the load on the endpoint in one undifferentiated line.

   A rule and a small label rather than a box: the page is already dense with
   panels, and nesting bordered cards inside a bordered card would read as four
   more panels rather than as four parts of one form. */
.group { border-top: 1px solid var(--rule); margin-top: 15px; padding-top: 12px; }
.group:first-child { border-top: 0; margin-top: 0; padding-top: 0; }
.group > h3 {
  margin: 0 0 10px;
  font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--phosphor-dim); font-weight: 700;
}
.group > h3 .sub {
  font-size: 10.5px; letter-spacing: 0; text-transform: none;
  color: var(--ink-muted); font-weight: 400; margin-left: 7px;
}
/* Checkbox groups are labelled by their own heading, so the fieldset carries
   the grouping for a screen reader without drawing a second frame around it. */
.group fieldset { border: 0; margin: 0; padding: 0; min-width: 0; }
.group fieldset > legend {
  padding: 0; margin-bottom: 3px;
  font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-2);
}

/* Three exclusive ways to say how much of a benchmark to run. The radio holds
   the exclusivity natively, which is the point -- the form used to express it
   with the word "or" in a label while the code sent both values. `:has()` only
   draws the selected row, so a browser without it still shows the state on the
   radio itself. */
.scope { display: flex; flex-direction: column; gap: 3px; }
.scope-opt {
  display: flex; align-items: center; gap: 9px; flex-wrap: wrap;
  padding: 7px 9px; border: 1px solid transparent; border-radius: 3px;
  font-size: 11.5px; color: var(--ink-2); cursor: pointer;
}
.scope-opt:hover { background: var(--surface-2); }
.scope-opt:has(input:checked) {
  border-color: var(--rule); background: var(--surface-2); color: var(--ink);
}
.scope-opt input[type="radio"] {
  flex: none; width: auto; margin: 0; accent-color: var(--phosphor-dim);
}
.scope-opt select { width: auto; flex: 0 1 220px; min-width: 0; }
.scope-opt input[type="number"] { width: auto; flex: 0 0 92px; }
.scope-opt .why { color: var(--ink-muted); font-size: 10.5px; }
.scope-opt:has(input[type="radio"]:disabled) { opacity: 0.5; }

/* The one line saying what pressing Start will actually do, set apart from the
   controls because it is a statement rather than another decision. */
.runplan {
  border-left: 2px solid var(--phosphor-dim);
  padding: 6px 0 6px 10px; margin: 15px 0 11px;
  font-size: 11.5px; color: var(--ink-2); line-height: 1.55;
}
.runplan b { color: var(--ink); font-weight: 700; }

/* ------------------------------- forms ---------------------------------- */

.field { margin-bottom: 11px; }
.field > label {
  display: block; margin-bottom: 3px;
  font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase;
  color: var(--ink-2);
}
/* Unscoped on purpose. This was written as `.field .hint`, a descendant rule,
   so a hint only got its styling when it sat *inside* a field -- and the two
   longest explanations on the Run tab were written as `class="field hint"`, one
   element carrying both classes, which matches a descendant selector never.
   They inherited the body instead: 14px full-strength ink against the 10.5px
   muted text they were meant to be, which made the two blocks of small print
   the loudest thing in the card and is most of why the form read as noisy. */
.hint {
  margin-top: 3px; font-size: 10.5px; color: var(--ink-muted); line-height: 1.45;
}
.hint code { color: var(--phosphor-dim); }

input[type="text"], input[type="number"], input[type="password"], select, textarea {
  width: 100%;
  background: var(--plane); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: 2px;
  font: inherit; font-size: 12px; padding: 6px 8px;
}
input:focus, select:focus, textarea:focus {
  outline: none; border-color: var(--phosphor-dim);
  box-shadow: 0 0 0 1px var(--phosphor-dim);
}
input:disabled, select:disabled, textarea:disabled {
  opacity: 0.45; cursor: not-allowed;
}
textarea { resize: vertical; min-height: 68px; line-height: 1.45; }
.row { display: flex; gap: 8px; align-items: flex-end; flex-wrap: wrap; }
.row .field { flex: 1 1 180px; margin-bottom: 0; }

.check { display: flex; align-items: flex-start; gap: 7px; margin-bottom: 9px; }
.check input { width: auto; margin-top: 2px; accent-color: var(--phosphor-dim); }
.check label { font-size: 11.5px; color: var(--ink-2); cursor: pointer; }
.check .hint { margin-top: 2px; }

/* ------------------------------ buttons --------------------------------- */

.btn {
  appearance: none; cursor: pointer;
  background: var(--surface-3); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 2px;
  font: inherit; font-size: 11.5px; padding: 6px 13px;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--phosphor-dim); }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.primary {
  background: var(--phosphor-dim); color: #04150a; border-color: var(--phosphor);
  font-weight: 700;
}
.btn.primary:hover:not(:disabled) { background: var(--phosphor); color: #000; }
.btn.danger { color: #f0a0a0; border-color: rgba(208, 59, 59, 0.5); }
.btn.danger:hover:not(:disabled) { background: rgba(208, 59, 59, 0.16); border-color: var(--critical); }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 4px; }

/* ------------------------------ feedback -------------------------------- */

.note {
  padding: 8px 10px; border-radius: 2px; font-size: 11.5px;
  border: 1px solid var(--hairline); margin-bottom: 10px;
  white-space: pre-wrap; word-break: break-word;
}
.note.ok   { border-color: rgba(12,163,12,0.5);  background: rgba(12,163,12,0.10);  color: #9ae8a0; }
.note.bad  { border-color: rgba(208,59,59,0.5);  background: rgba(208,59,59,0.10);  color: #f0a8a8; }
.note.warn { border-color: rgba(250,178,25,0.5); background: rgba(250,178,25,0.09); color: #f2d089; }
.note.info { color: var(--ink-2); }
.note pre { margin: 6px 0 0; font-size: 11px; color: var(--ink-2); white-space: pre-wrap; }

.checklist { list-style: none; margin: 0; padding: 0; }
.failure-box { margin: 0 0 10px; }
/* A trial's captured error, as written. Scrolls rather than grows: this sits
   above the console, and a 900-character capture that pushed the console off
   the screen would trade one unreadable thing for another. */
.trial-err {
  margin: 4px 0 0;
  padding: 6px 8px;
  max-height: 200px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 11px;
  line-height: 1.45;
  color: var(--ink-2);
  background: var(--sunken, rgba(0, 0, 0, 0.28));
  border-left: 2px solid var(--rule);
  border-radius: 3px;
}

/* A failed check is a paragraph and a list of steps, not a one-line verdict --
   see renderFinding. Indented under its own mark so the steps read as belonging
   to that finding rather than to the panel. */
.checklist li.finding { display: grid; grid-template-columns: auto 1fr; gap: 2px 9px; align-items: start; }
.checklist li.finding .finding-body { grid-column: 2; }
.finding-detail { margin: 4px 0 8px; color: var(--ink-dim); line-height: 1.5; max-width: 68ch; }
.fix-label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-muted); margin-bottom: 4px; }
.fixes { margin: 0 0 6px; padding-left: 20px; line-height: 1.55; max-width: 68ch; }
.fixes li { margin: 2px 0; }
.fix-docs { color: var(--ink-muted); font-size: 12px; }
.mark.warn { color: var(--warning); }
.checklist li.finding.warn .what { color: var(--warning); }
.checklist li {
  display: flex; gap: 9px; align-items: baseline;
  padding: 5px 0; border-bottom: 1px solid var(--hairline); font-size: 11.5px;
}
.checklist li:last-child { border-bottom: none; }
.checklist .mark { font-weight: 700; flex: none; width: 1.6em; }
.checklist .mark.ok { color: #4fe07a; }
.checklist .mark.no { color: #f08a8a; }
.checklist .what { flex: none; min-width: 15em; color: var(--ink); }
.checklist .detail { color: var(--ink-muted); word-break: break-word; }

/* --------------------------- console output ------------------------------ */

.console {
  background: var(--plane); border: 1px solid var(--hairline); border-radius: 2px;
  padding: 9px 11px; height: 340px; overflow-y: auto;
  font-size: 11px; line-height: 1.5; color: var(--ink-2);
  white-space: pre-wrap; word-break: break-word;
}
.console:empty::after { content: "no output yet"; color: var(--ink-muted); }
.console .ln { display: block; }
.console .ln.rule { color: var(--phosphor-dim); }
.console .ln.warn { color: var(--warning); }
.console .ln.bad  { color: #f08a8a; }

.runbar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 8px 12px; border-bottom: 1px solid var(--rule);
  font-size: 11.5px; color: var(--ink-2);
}
.runbar .state {
  font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; font-size: 10.5px;
}
.runbar .state.running  { color: var(--phosphor); }
.runbar .state.finished { color: #4fe07a; }
.runbar .state.failed,
.runbar .state.stopped  { color: #f08a8a; }
.runbar .state.idle     { color: var(--ink-muted); }

/* ------------------------------- lists ---------------------------------- */

.itemlist { display: flex; flex-direction: column; gap: 8px; }
.item {
  border: 1px solid var(--hairline); border-radius: 2px;
  background: var(--surface-2); padding: 9px 11px;
}
.item-head {
  display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap;
}
.item-head .name { color: var(--ink); font-weight: 700; }
.item-head .meta { color: var(--ink-muted); font-size: 10.5px; }
.item-head .spacer { flex: 1; }
.item dl {
  margin: 7px 0 0; display: grid;
  grid-template-columns: max-content minmax(0, 1fr); gap: 2px 12px; font-size: 11px;
}
.item dt { color: var(--ink-muted); }
.item dd { margin: 0; color: var(--ink-2); word-break: break-all; }

.readonly-banner {
  margin-bottom: 8px; padding: 7px 11px; border-radius: 2px; font-size: 11.5px;
  border: 1px solid rgba(250,178,25,0.45); background: rgba(250,178,25,0.08);
  color: #f2d089;
}

@media (max-width: 1180px), (max-height: 620px) {
  .tabpane.on { display: block; }
}
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <h1>harness&#8203;-arena</h1>
      <p class="tagline">your model &middot; many harnesses &middot; many benchmarks</p>
    </div>
    <div class="live" id="live"><span class="dot"></span><span id="live-text">connecting</span></div>
  </div>
</header>

<div class="wrap">
  <nav class="tabs" id="tabs" role="tablist">
    <button role="tab" data-tab="results" aria-selected="true">Results</button>
    <button role="tab" data-tab="run" aria-selected="false">Run<span class="tab-flag hidden" id="run-flag"></span></button>
    <button role="tab" data-tab="setup" aria-selected="false">Setup</button>
    <button role="tab" data-tab="harnesses" aria-selected="false">Harnesses</button>
    <button role="tab" data-tab="maintenance" aria-selected="false">Maintenance</button>
  </nav>

  <section class="tabpane on" id="pane-results" role="tabpanel">
    <div id="app"><div class="empty">Loading&hellip;</div></div>
    <footer id="foot"></footer>
  </section>

  <section class="tabpane doc" id="pane-run" role="tabpanel"></section>
  <section class="tabpane doc" id="pane-setup" role="tabpanel"></section>
  <section class="tabpane doc" id="pane-harnesses" role="tabpanel"></section>
  <section class="tabpane doc" id="pane-maintenance" role="tabpanel"></section>
</div>

<div id="tip" role="tooltip" aria-hidden="true"></div>

<script>
"use strict";

const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const POLL_MS = 5000;

const state = {
  data: null,
  activity: null,       // live tail of the in-flight trial
  model: null,          // selected model fingerprint
  // Selected benchmark, as the dataset id (""for runs recorded without one).
  // Scopes the view alongside `model`: every total, ranking and comparison on
  // the results page is meaningful only within one benchmark.
  dataset: null,
  hidden: new Set(),    // harness ids toggled off
  hidePartial: false,   // smoke runs are shown until you say otherwise
  // Which runs to show, by run_id. null means all of them -- distinct from an
  // empty set, which means the user deselected everything and should see
  // nothing rather than silently getting everything back.
  runPick: null,
  runMenuOpen: false,   // survives the 5s re-render
  diffOnly: false,
  tableView: new Set(), // panel ids showing their table twin
  colors: new Map(),    // harness id -> css var  (assigned once, never by rank)
  expanded: null,       // panel id shown full-screen, or null
};

/* Scroll position inside the expanded panel. Kept out of `state` because these
   are written on every scroll event and read only here -- putting them in state
   would imply the render path cares about them.

   The feed is a *tail*: old lines drop off the top as new ones arrive, so an
   absolute scrollTop means something different after every poll. Distance from
   the bottom is the stable measure, which is what the docked feed already uses
   and what this mirrors. `pinned` is tracked separately because sitting exactly
   at the bottom means "follow the newest", and that has to survive content
   arriving. Anything else keeps its place instead of being dragged down. */
let expandedScroll = 0;
let expandedFromBottom = 0;
let expandedPinned = true;

/* A scrollbar a pixel or two short of the end still means "at the bottom". */
const TAIL_SLACK_PX = 24;

/* Split out from the DOM so the rule itself can be tested: the element these
   run against only exists in a browser, but getting them wrong is what makes a
   live view either stop following or steal the reader's place. */
function tailIsPinned(scrollTop, clientHeight, scrollHeight) {
  return scrollTop + clientHeight >= scrollHeight - TAIL_SLACK_PX;
}

function tailScrollTop(scrollHeight, pinned, fromBottom) {
  return pinned ? scrollHeight : Math.max(0, scrollHeight - fromBottom);
}

/* ------------------------------ helpers -------------------------------- */

const $ = (sel, root) => (root || document).querySelector(sel);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g,
  (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const pct = (x) => (x * 100).toFixed(1) + "%";
const int = (n) => (n == null ? "—" : Math.round(n).toLocaleString());

function dur(s) {
  if (s == null) return "—";
  if (s < 60) return s.toFixed(1) + "s";
  if (s < 3600) return Math.floor(s / 60) + "m " + Math.round(s % 60) + "s";
  return Math.floor(s / 3600) + "h " + Math.round((s % 3600) / 60) + "m";
}

function shortTime(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return isNaN(d) ? "—" : d.toLocaleString(undefined,
    { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}

/* Color follows the entity. Assigned in first-seen order and cached, so
   toggling a harness off never repaints the survivors. */
function colorOf(harness) {
  if (!state.colors.has(harness)) {
    state.colors.set(harness, SERIES[state.colors.size % SERIES.length]);
  }
  return "var(" + state.colors.get(harness) + ")";
}

/* ------------------------------ tooltip -------------------------------- */

const tip = $("#tip");
function showTip(evt, html) {
  tip.innerHTML = html;
  tip.classList.add("on");
  tip.setAttribute("aria-hidden", "false");
  const pad = 14, r = tip.getBoundingClientRect();
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + r.width > innerWidth - 8) x = evt.clientX - r.width - pad;
  if (y + r.height > innerHeight - 8) y = evt.clientY - r.height - pad;
  tip.style.left = Math.max(8, x) + "px";
  tip.style.top = Math.max(8, y) + "px";
}
function hideTip() {
  tip.classList.remove("on");
  tip.setAttribute("aria-hidden", "true");
}
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el) showTip(e, el.getAttribute("data-tip"));
});
document.addEventListener("mousemove", (e) => {
  const el = e.target.closest("[data-tip]");
  if (el) showTip(e, el.getAttribute("data-tip")); else hideTip();
});
document.addEventListener("mouseleave", hideTip);

/* Registered once on the document rather than per render: the dialog is rebuilt
   every five seconds, and re-binding a key handler to a new node each time is
   how you end up with several of them. */
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && state.expanded) closeExpanded();
});

/* ------------------------------ selection ------------------------------- */

function modelsOf(data) {
  return data.models || [];
}

/* Runs for the selected model, across every benchmark. Only two things read
   this: the benchmark selector, which has to know which benchmarks this model
   actually ran, and the smoke-filter count, which is scoped separately. */
function runsForModel(data) {
  const key = state.model;
  return (data.runs || []).filter(
    (r) => (r.model_fingerprint || r.model_label) === key
  );
}

/* A run recorded before --dataset was captured carries none, which is still a
   scope -- one bucket, labelled as unknown, rather than a run that vanishes. */
function datasetKey(run) {
  return run.dataset || "";
}

/* The benchmarks the selected model has runs for, labelled from the catalog
   where collect could resolve one. Ordered by label rather than by recency:
   this is a list you find a name in, and an order that reshuffles every time a
   run lands would move the entry you were reaching for. */
function datasetsOf(data) {
  const counts = new Map();
  for (const r of runsForModel(data)) {
    const key = datasetKey(r);
    if (!counts.has(key)) {
      const known = (data.datasets || []).find((d) => (d.id || "") === key);
      counts.set(key, {
        key,
        label: (known && known.label) || key || "unknown benchmark",
        n: 0,
      });
    }
    counts.get(key).n += 1;
  }
  return [...counts.values()].sort((a, b) => a.label.localeCompare(b.label));
}

/* Harness lists are always alphabetical, wherever they appear.

   registry.yaml is an ordered mapping and every list here used to render it
   verbatim, so the order was whatever order the rows happened to be written
   in -- and it drifted further from alphabetical with each edit, because a
   harness added from the dashboard appends to the end. Sorting the YAML would
   not hold: save() rewrites it from parsed YAML in insertion order, so the
   next addition lands at the bottom again. It belongs here.

   Sorted on the label, because that is the text the reader is scanning; the id
   breaks ties and covers a row that never set one. */
const byHarnessName = (a, b) =>
  String(a.label || a.id).localeCompare(String(b.label || b.id)) ||
  String(a.id).localeCompare(String(b.id));

/* The same order for a plain list of ids, given the catalog to name them. */
function harnessIdsSorted(harnesses) {
  return Object.keys(harnesses || {}).sort((x, y) =>
    byHarnessName(
      { id: x, label: (harnesses[x] || {}).label },
      { id: y, label: (harnesses[y] || {}).label },
    ),
  );
}

/* Runs in the current scope: one model AND one benchmark.
   Everything that totals, ranks, charts or compares reads this rather than
   runsForModel. Two benchmarks pooled into one pass rate is an average over
   different denominators -- 89 Terminal-Bench tasks and 225 polyglot ones --
   and nothing on screen would reveal that it happened. */
function runsInScope(data) {
  // null means "not scoped yet", the same distinction `runPick` draws: render()
  // resolves it to a real benchmark before anything is drawn, and until then
  // every run counts. An empty string is a real scope -- the bucket for runs
  // recorded before --dataset was captured -- so it is not the same as null.
  if (state.dataset === null) return runsForModel(data);
  return runsForModel(data).filter((r) => datasetKey(r) === state.dataset);
}

/* An ad-hoc "-Tasks 3" run answers "does the adapter work"; a *named* subset
   ("-Subset stratified-25") is a deliberate experiment every harness ran
   identically. Only the former is a smoke test, so only the former is hidden. */
function isSmoke(run) {
  return run.is_partial && !run.subset;
}

function visibleRuns(data) {
  return runsInScope(data).filter(
    (r) => !state.hidden.has(r.harness)
        && !(state.hidePartial && isSmoke(r))
        && (state.runPick === null || state.runPick.has(r.run_id))
  );
}

/* The name a run is picked by: its subset, or what it is instead of one. */
function scopeName(run) {
  if (run.subset) return run.subset;
  if (run.is_partial) return "smoke";
  return "full dataset";
}

/* Runs grouped by scope, newest first within each, for the picker. Built from
   the model-scoped list rather than the visible one -- a run hidden by the
   picker still has to appear in it, or there is no way to switch it back on. */
/* Runs grouped into sweeps -- one `bench` invocation across its harnesses,
   which is what "a run" means when you started one. Keyed on the recorded
   batch id; runs from before sweeps had an identity fall back to their subset
   name, which is how they have always been grouped. Newest sweep first. */
function runGroups(data) {
  const groups = new Map();
  // Scoped, not model-wide: a sweep that ran a different benchmark cannot be
  // switched back on into this view, so offering it would be a control that
  // silently does nothing.
  runsInScope(data).forEach((r) => {
    const key = r.batch_id || `legacy:${scopeName(r)}`;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  });
  return [...groups.entries()]
    .map(([key, runs]) => {
      const sorted = runs.slice()
        .sort((a, b) => (b.started_at || "").localeCompare(a.started_at || ""));
      const scopes = [...new Set(sorted.map(scopeName))];
      return {
        // Addressed by key, not name: two sweeps of the same subset share a
        // name, and toggling one would otherwise toggle both.
        key,
        // A sweep is normally one subset; only a legacy fallback can mix them.
        name: scopes.length === 1 ? scopes[0] : scopes.join(" + "),
        startedAt: sorted[sorted.length - 1].started_at || "",
        runs: sorted,
      };
    })
    .sort((a, b) => b.startedAt.localeCompare(a.startedAt));
}


function scopeBadge(run) {
  if (run.subset) return `<span class="badge badge-subset">${esc(run.subset)}</span>`;
  if (run.is_partial) return `<span class="badge">smoke</span>`;
  return "";
}

/* Disambiguate repeat runs of the same harness. Two rows both reading
   "oh-my-pi" are unreadable the moment you re-run a harness -- which is the
   normal case here, since every model swap re-runs all of them. */
function runLabel(run, runs) {
  const repeats = runs.filter((r) => r.harness === run.harness).length > 1;
  if (!repeats) return run.harness_label;
  const when = run.started_at ? new Date(run.started_at) : null;
  const stamp = when && !isNaN(when)
    ? when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" })
    : run.run_id.slice(-15);
  return `${run.harness_label} · ${stamp}`;
}

/* ------------------------------- panels --------------------------------- */

/* Scroll positions of every panel body, keyed by panel id, so a re-render does
   not throw the reader back to the top. Both axes: the matrix scrolls sideways
   too once there are more than a few harnesses. */
function capturePaneScroll() {
  const saved = new Map();
  document.querySelectorAll("[data-pane]").forEach((el) => {
    if (el.scrollTop || el.scrollLeft) {
      saved.set(el.getAttribute("data-pane"), [el.scrollTop, el.scrollLeft]);
    }
  });
  return saved;
}

function restorePaneScroll(saved) {
  saved.forEach(([top, left], id) => {
    const el = document.querySelector(`[data-pane="${id}"]`);
    if (!el) return;
    // Assigning past the end clamps, so a panel whose content shrank lands at
    // its new bottom rather than throwing.
    el.scrollTop = top;
    el.scrollLeft = left;
  });
}

function panel(id, title, note, bodyHtml, tableHtml, area) {
  const showTable = state.tableView.has(id);
  const toggle = tableHtml
    ? `<button class="ghost toggle-view" data-table="${id}">${showTable ? "chart" : "table"}</button>`
    : "";
  return `
    <section class="panel" data-panel="${esc(id)}" style="--area:${area || id}">
      <div class="panel-head">
        <h2>${esc(title)}</h2>
        <div style="display:flex;align-items:center;gap:10px;min-width:0">
          ${note ? `<span class="note">${note}</span>` : ""}
          ${toggle}
          <button class="ghost panel-expand" data-expand="${esc(id)}"
                  title="Expand to full screen" aria-label="Expand ${esc(title)}">&#9974;</button>
        </div>
      </div>
      <div class="panel-body" data-pane="${esc(id)}">${showTable ? tableHtml : bodyHtml}</div>
    </section>`;
}

/* --------------------------- 1. stat tiles ------------------------------ */

function renderTiles(data, runs) {
  const done = runs.filter((r) => r.n_done > 0);
  const best = done.slice().sort((a, b) => b.pass_rate - a.pass_rate)[0];
  const worst = done.slice().sort((a, b) => a.pass_rate - b.pass_rate)[0];
  const spread = best && worst && best !== worst ? best.pass_rate - worst.pass_rate : null;
  // Counted over the runs on screen, not over every run there is. This tile
  // sits inside a scope -- one model, one benchmark -- so a global count in it
  // is the same pooling the scope exists to stop: it would report a run in
  // flight on a benchmark this view is not showing. The header's live
  // indicator is the unscoped one, and it is on every tab.
  const running = runs.filter((r) => r.status === "running").length;
  const model = modelsOf(data).find(
    (m) => (m.fingerprint || m.label) === state.model
  );
  const ctxWindow = model ? model.context_window || model.n_ctx || 0 : 0;

  const tiles = [
    {
      k: "best harness",
      v: best ? pct(best.pass_rate) : "—",
      sub: best ? esc(best.harness_label) : "no runs yet",
    },
    {
      k: "harness spread",
      v: spread == null ? "—" : (spread * 100).toFixed(1) + " pts",
      sub: spread == null ? "needs 2 harnesses" : "best minus worst, same model",
    },
    {
      // "in view", not "on this model": the value is what the filters left,
      // inside a scope that is now a model *and* a benchmark.
      k: "runs in view",
      v: String(runs.length),
      sub: running ? running + " in flight" : "all complete",
    },
    {
      k: "context",
      // What the harnesses were told, falling back to what the server said.
      // An Ollama endpoint reports no window at all, so reading the probe
      // alone showed "—" for runs whose window was configured and recorded.
      v: ctxWindow ? (ctxWindow / 1024).toFixed(0) + "K" : "—",
      sub: model ? esc(model.quant || "") : "",
    },
  ];

  return `<div class="tiles">${tiles.map((t) => `
    <div class="tile">
      <div class="k">${esc(t.k)}</div>
      <div class="v">${t.v}</div>
      <div class="sub">${t.sub}</div>
    </div>`).join("")}</div>`;
}

/* ---------------------------- 1b. live feed ----------------------------- */

const TAG = { assistant: "thinking", tool: "tool", result: "output", meta: "" };

function renderFeed() {
  const a = state.activity;
  if (!a || !a.active) return "";

  const quiet = a.silent_s == null ? 0 : a.silent_s;
  const meta = [
    `<span><b>${esc(a.harness_label || a.harness || "agent")}</b> on
       <b>${esc(a.task || "?")}</b></span>`,
    a.model_label ? `<span>${esc(a.model_label)}</span>` : "",
    // The model's clock, which does not start until the container is built and
    // the harness installed. Before that there is no agent time to report, so
    // the setup clock is shown in its place and named -- a trial can sit here
    // for minutes on a cold image pull, and calling that "elapsed" charged it
    // to the model and let a trial show more elapsed than its agent timeout
    // permits, which is how the mislabelling was caught.
    a.elapsed_s != null
      ? `<span title="Agent execution only. Setup${
           a.setup_s != null ? " took " + dur(a.setup_s) : ""
         } and is not counted here.">elapsed <b>${dur(a.elapsed_s)}</b></span>`
      : a.setup_s != null
        ? `<span title="Pulling the image, building the container and installing the harness. The model has not started yet.">setting up <b>${dur(a.setup_s)}</b></span>`
        : "",
    a.log_bytes ? `<span>trajectory <b>${(a.log_bytes / 1024).toFixed(0)} KB</b></span>` : "",
    quiet > 45
      ? `<span class="feed-quiet">no new output for ${dur(quiet)}</span>`
      : `<span style="color:var(--good)">streaming</span>`,
  ].join("");

  // Two states routinely look like a hang and are not one. Saying so here is
  // cheaper than the user killing a healthy run.
  const note = quiet > 45
    ? `<div class="feed-note">
         Agent output is piped through <code>tee</code>, which flushes one line at
         a time — a long unbroken reasoning block produces nothing until it ends,
         then arrives all at once. A quiet feed is normal; an agent can also think
         for many minutes before writing its first file.
       </div>`
    : "";

  const body = a.entries && a.entries.length
    ? a.entries.map((e, i) => {
        const last = i === a.entries.length - 1;
        return `<div class="feed-entry ${esc(e.kind)}">
          <div class="feed-tag">${esc(TAG[e.kind] ?? e.kind)}</div>
          <div class="feed-text">${esc(e.text)}${last ? '<span class="feed-cursor"></span>' : ""}</div>
        </div>`;
      }).join("")
    : `<div class="feed-entry"><div class="feed-tag"></div>
         <div class="feed-text">${a.phase === "agent"
           ? "Waiting for the first output…"
           : "Installing the harness in the task container…"}</div></div>`;

  return panel(
    "feed",
    "live feed",
    "tail of the running trial",
    `<div class="feed-meta">${meta}</div>${note}<div class="feed" id="feed-scroll">${body}</div>`,
    null,
    "feed"
  ).replace('class="panel"', 'class="panel feed-panel"');
}

/* --------------------------- 2. leaderboard ----------------------------- */

function renderLeaderboard(runs) {
  const rows = runs.filter((r) => r.n_done > 0)
                   .sort((a, b) => b.pass_rate - a.pass_rate);
  if (!rows.length) {
    return panel("lb", "pass rate", "", `<div class="empty">No completed trials yet.</div>`, null, "rate");
  }

  const ticks = [0, 25, 50, 75, 100];
  const grid = ticks.map((t) => `<i style="left:${t}%"></i>`).join("");

  const body = `
    <div class="lb">
      ${rows.map((r) => {
        const c = colorOf(r.harness);
        const tipHtml = [
          `<div class="t-h">${esc(r.harness_label)}</div>`,
          `<div class="t-r">solved <b>${r.n_resolved}</b> of <b>${r.n_done}</b> scored</div>`,
          `<div class="t-r">95% Wilson CI <b>${pct(r.ci_low)} – ${pct(r.ci_high)}</b>
             — overlapping whiskers mean the gap is unresolved</div>`,
          r.n_checks_total
            ? `<div class="t-r">passed <b>${r.n_checks_passed}</b> of
               <b>${r.n_checks_total}</b> individual checks (<b>${pct(r.check_rate)}</b>)
               — partial credit, which the all-or-nothing score throws away.
               Not comparable to the pass rate: tasks carry different numbers of
               checks, so this weights a nine-check task nine times a one-check
               one, and the checks are not equally hard.</div>`
            : "",
          r.n_errors ? `<div class="t-r">errored <b>${r.n_errors}</b></div>` : "",
          // Never silent: a denominator that shrank without saying so is the
          // one way this panel could mislead about the experiment itself.
          r.n_unscored
            ? `<div class="t-r">not scored <b>${r.n_unscored}</b> — the harness could
               not send a request; excluded from the rate${
                 r.debug_capture ? "" : " (diagnostics were off, so the cause is unrecorded)"}</div>`
            : "",
          `<div class="t-r">concurrency <b>${r.n_concurrent == null ? "?" : r.n_concurrent}</b>
             ${r.n_concurrent_agents != null
               ? `· generating at once <b>${r.n_concurrent_agents}</b>` : ""}
             ${r.endpoint_slots != null
               ? `· endpoint slots <b>${r.endpoint_slots}</b>` : ""}</div>`,
          // Queued requests inflate latency and the bill lands on whichever
          // harness makes more calls, which is the thing being measured.
          r.endpoint_slots != null && r.n_concurrent_agents > r.endpoint_slots
            ? `<div class="t-r warn-line">ran more agents than the endpoint had
               slots — requests queued, and the wait fell hardest on whichever
               harness made more calls</div>`
            : "",
          r.max_retries
            ? `<div class="t-r">retried failed trials up to <b>${r.max_retries}</b>×</div>`
            : "",
          r.context_window
            ? `<div class="t-r${r.context_window_source === "fallback" ? " warn-line" : ""}">
               harnesses told the window is
               <b>${(r.context_window / 1024).toFixed(0)}K</b>
               (${int(r.context_window)}), max <b>${int(r.agent_max_tokens)}</b> out${
                 // "4K, detected" and "4K, because nothing knew" are not the
                 // same claim about a run. Only the second is a warning.
                 r.context_window_source === "fallback"
                   ? " &mdash; a fallback: neither the server nor the configuration"
                     + " said, so this may not be the window actually served"
                   : r.context_window_source
                     ? ` (${esc(r.context_window_source)})`
                     : ""
               }</div>`
            : "",
          // Only shown when it is not the harness default: a run that was told
          // not to think is a different experiment from one that was, and the
          // rest of this panel would describe the two identically.
          r.reasoning_effort && r.reasoning_effort !== "high"
            ? `<div class="t-r">reasoning effort <b>${esc(r.reasoning_effort)}</b>${
                 r.reasoning_effort_source
                   ? ` (${esc(r.reasoning_effort_source)})`
                   : ""
               }</div>`
            : "",
        ].join("");
        return `
        <div class="lb-row">
          <div class="lb-name">
            <span class="swatch" style="background:${c}"></span>
            <span style="min-width:0">
              <span class="nm">${esc(runLabel(r, rows))} ${scopeBadge(r)}</span>
              <span class="mdl">${
                r.status === "running" ? "in flight · "
                : r.status === "stopped" ? "stopped · "
                : ""
              }${r.n_done}/${r.n_total}</span>
            </span>
          </div>
          <div class="lb-track" data-tip="${esc(tipHtml)}">
            <div class="lb-grid">${grid}</div>
            <div class="lb-bar" style="width:${(r.pass_rate * 100).toFixed(2)}%;background:${c}"></div>
            <div class="lb-ci" style="left:${(r.ci_low * 100).toFixed(2)}%;width:${((r.ci_high - r.ci_low) * 100).toFixed(2)}%"></div>
          </div>
          <div class="lb-val">
            <span class="pct">${pct(r.pass_rate)}</span>
            <span class="of">${r.n_resolved}/${r.n_done}</span>
          </div>
          ${r.n_checks_total ? renderChecks(r) : ""}
        </div>`;
      }).join("")}
      <div class="axis-row">
        <div class="axis-ticks">${ticks.map((t) => `<span style="left:${t}%">${t}%</span>`).join("")}</div>
      </div>
    </div>`;

  const table = `
    <table class="data">
      <thead><tr>
        <th>harness</th><th class="num">pass rate</th><th class="num">95% CI</th>
        <th class="num">solved</th><th class="num">scored</th><th class="num">errors</th>
        <th class="num">median task</th><th class="num">out tok / solve</th>
        <th class="num">out tok / trial</th>
      </tr></thead>
      <tbody>${rows.map((r) => `
        <tr>
          <td>${esc(r.harness_label)}</td>
          <td class="num">${pct(r.pass_rate)}</td>
          <td class="num">${pct(r.ci_low)} – ${pct(r.ci_high)}</td>
          <td class="num">${r.n_resolved}</td>
          <td class="num">${r.n_done}</td>
          <td class="num">${r.n_errors}</td>
          <td class="num">${dur(r.median_duration_s)}</td>
          <td class="num">${int(r.mean_output_tokens_per_solve)}</td>
          <td class="num"${r.n_token_samples != null && r.n_token_samples < r.n_done
            ? ` title="over ${r.n_token_samples} of ${r.n_done} trials; the rest reported no usage"`
            : ""}>${int(r.mean_output_tokens_per_trial)}${
            r.n_token_samples != null && r.n_token_samples < r.n_done ? "*" : ""}</td>
        </tr>`).join("")}
      </tbody>
    </table>`;

  // Kept short: the panel header is a narrow column and a long note just
  // truncates. The full explanation lives on each bar's tooltip.
  const note = `whiskers = 95% CI`;
  return panel("lb", "pass rate", note, body, table, "rate");
}

/* Partial credit, reported as two numbers because one of them is mostly the
   pass rate again.
 *
 * A solved task passes every check by definition, so it contributes a
 * guaranteed 100% to any total that includes it. Measured on four runs here,
 * that is 43 of 43 checks for one of them -- and ranking by the all-inclusive
 * figure put that run top while ranking by what it salvaged from its failures
 * put it bottom. So the number that leads is the one over tasks it did *not*
 * solve: that is the question the panel exists to answer, "how close did the
 * misses come", and it is the only part the pass rate has not already told you.
 *
 * The all-inclusive figure stays, quieter, because it is what someone who has
 * read this panel before will expect to see and its absence would read as a
 * number having gone missing.                                              */
function renderChecks(r) {
  const overall = `${r.n_checks_passed}/${r.n_checks_total}`;
  // Older result files predate the split, and every run in a comparison has to
  // render even when one of them was collected by a previous version.
  if (!r.n_checks_missed_total) {
    return `<div class="lb-checks" title="Every individual check this run passed, over every check it faced. Scoring is all-or-nothing, so this is how close it got — not a score, and not comparable to the pass rate.">
              <b>${pct(r.check_rate)}</b> of checks
              <div>${overall}</div>
            </div>`;
  }
  const missed = `${r.n_checks_missed_passed}/${r.n_checks_missed_total}`;
  return `<div class="lb-checks" title="Of the checks belonging to tasks this run did not solve, how many it still passed — the partial credit the all-or-nothing score throws away. Reported separately because a solved task passes every check by definition, so including them mostly restates the pass rate. Neither figure is a score: tasks carry different numbers of checks and the checks are not equally hard.">
            <b>${pct(r.missed_check_rate)}</b> of checks on ${r.n_missed} unsolved
            <div>${missed} <span class="lb-checks-all">· ${overall} incl. solved</span></div>
          </div>`;
}

/* ----------------------------- 3. matrix -------------------------------- */

const CELL = {
  pass:    { cls: "pass",    glyph: "✓", word: "solved" },
  fail:    { cls: "fail",    glyph: "·", word: "failed" },
  error:   { cls: "error",   glyph: "!", word: "errored" },
  timeout: { cls: "timeout", glyph: "T", word: "ran out of time" },
  pending: { cls: "pending", glyph: "·", word: "not run" },
  unscored: { cls: "unscored", glyph: "~", word: "request never reached the model" },
};

function cellFor(run, task) {
  const t = (run._byTask || {})[task];
  if (!t) return { ...CELL.pending, task: null };
  const timedOut = !!t.error_type && /timeout/i.test(t.error_type);

  // The verifier runs even when the agent is killed, grading whatever was left
  // on disk -- so a trial can time out *and* pass. The reward is ground truth,
  // and it is what the pass rate counts, so the cell must agree with it.
  // Checking the exception first would show a solved task as a timeout.
  if (t.resolved) return { ...CELL.pass, task: t, late: timedOut };

  // The connection to the model died mid-trial. That is infrastructure, not
  // the harness being wrong, and it is excluded from the pass rate -- so it
  // must not wear the same "!" as a harness that crashed on its own.
  if (t.fault === "transport") return { ...CELL.unscored, task: t };

  // A timeout is not a crash and not a wrong answer -- the agent was still
  // working when the budget ran out. Lumping it in with errors hides the single
  // most actionable signal when driving a slow local model.
  //
  // The verifier still ran, so a timed-out trial can carry partial credit, and
  // returning here before the check-ratio branch below threw that away: the
  // cell said "T" while the tooltip said "1 of 3 checks passed". Both facts fit
  // in the cell, and which one you need depends on the question -- "did it run
  // out of road" or "how far did it get". Kept as text rather than a second
  // shade of amber, because a hue cannot say 1/3 rather than 5/6, and every
  // other state here carries a glyph and a label rather than colour alone.
  if (timedOut) {
    return t.n_checks
      ? {
          ...CELL.timeout,
          task: t,
          glyph: `T ${t.n_checks_passed}/${t.n_checks}`,
          word: `ran out of time, ${t.n_checks_passed} of ${t.n_checks} checks passed`,
        }
      : { ...CELL.timeout, task: t };
  }
  if (t.error_type) return { ...CELL.error, task: t };

  // The verifier ran and could not turn the work into a number -- on every
  // benchmark that compiles its tests against the agent's code, that is what
  // "did not implement it" looks like. A wrong answer, so it wears the failure
  // dot; the reason travels in the tooltip because "failed" alone would not
  // explain an empty check list. collect.py clears error_type for these, so
  // reaching here means it is genuinely a graded failure.
  if (t.no_reward_reason) {
    return { ...CELL.fail, task: t, word: "failed — the verifier could not score it" };
  }

  // Scoring is all-or-nothing, so "5/6" and "0/6" both score zero — but one
  // got somewhere and the other did not. Show the ratio in the cell rather
  // than a uniform dot, and tint anything that passed a check at all.
  //
  // The line is at "any", not at a fraction: the ratios are not comparable
  // across tasks, because tasks have different numbers of checks and the
  // checks are not equally hard. Half of six is not the same achievement as
  // half of two, so a threshold would rank things the data cannot rank. That
  // one check passed is a fact about the trial; "most of them" is a judgement.
  if (t.n_checks) {
    return {
      ...CELL.fail,
      task: t,
      glyph: `${t.n_checks_passed}/${t.n_checks}`,
      word: `failed ${t.n_checks - t.n_checks_passed} of ${t.n_checks} checks`,
      near: t.n_checks_passed > 0,
    };
  }
  return { ...CELL.fail, task: t };
}

/* Legend entries, keyed by the cell state they describe. Only the states
   present in the current view are rendered -- a legend listing outcomes that
   never occurred reads as noise, and two green ticks that differ only by an
   underline read as a duplicate. */
const LEGEND = [
  ["pass", '<b style="color:#4fe07a">✓</b> solved'],
  ["late", '<b style="color:#4fe07a;box-shadow:inset 0 -2px 0 0 var(--warning)">✓</b> solved, but killed at the time limit'],
  ["near", '<b style="color:#c9a24a">1/6</b> scored zero, but passed at least one check — hover for which'],
  ["fail", '<b style="color:var(--ink-muted)">·</b> failed'],
  ["timeout", '<b style="color:#f6c657">T 1/3</b> out of time — with whatever checks it had passed by then'],
  ["error", '<b style="color:#f08a8a">!</b> errored (harness fault, not a wrong answer)'],
  ["unscored", '<b style="color:#7aa2c9">~</b> the request never reached the model — not scored, not counted against the harness'],
];

function legendFor(kinds) {
  const parts = LEGEND.filter(([k]) => kinds.has(k)).map(([, html]) => `<span>${html}</span>`);
  // The all-or-nothing caveat only earns its space when a near miss is visible.
  if (kinds.has("near")) {
    parts.push('<span style="color:var(--ink-muted)">scoring is all-or-nothing: 5/6 scores the same as 0/6</span>');
  }
  return parts.join("");
}

/** The per-check breakdown, as a compact list for the tooltip. */
function checkList(task) {
  if (!task || !task.checks || !task.checks.length) return "";
  const rows = task.checks
    .map((c) => {
      const ok = c.status === "passed";
      return `<div class="t-chk">
        <span class="${ok ? "ok" : "no"}">${ok ? "✓" : "✕"}</span> ${esc(c.name)}
      </div>`;
    })
    .join("");
  return `<div class="t-checks">${rows}</div>`;
}

function renderMatrix(data, runs) {
  if (!runs.length) {
    return panel("mx", "task matrix", "", `<div class="empty">No runs yet.</div>`, null, "matrix");
  }

  runs.forEach((r) => {
    r._byTask = {};
    r.tasks.forEach((t) => { r._byTask[t.task_name] = t; });
  });

  let tasks = (data.task_names || []).filter((name) =>
    runs.some((r) => r._byTask[name])
  );

  if (state.diffOnly && runs.length > 1) {
    tasks = tasks.filter((name) => {
      const seen = runs
        .map((r) => r._byTask[name])
        .filter(Boolean)
        .map((t) => !!t.resolved);
      return seen.length > 1 && new Set(seen).size > 1;
    });
  }

  // Which cell states actually occur, so the legend explains what is on screen
  // rather than the full vocabulary. Two near-identical green ticks read as a
  // duplicate when the second state has never once happened.
  const seenKinds = new Set();

  const head = `<tr>
      <th class="task-col">task (${tasks.length})</th>
      ${runs.map((r) => `<th><span class="swatch" style="display:inline-block;background:${colorOf(r.harness)}"></span> ${esc(runLabel(r, runs))}</th>`).join("")}
    </tr>`;

  const rows = tasks.map((name) => `
      <tr>
        <th title="${esc(name)}">${esc(name)}</th>
        ${runs.map((r) => {
          const c = cellFor(r, name);
          const t = c.task;
