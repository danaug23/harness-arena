/* One sentence describing the run the form currently specifies, in the words
   the results view will use for it afterwards. Built once and rendered in two
   places -- the line above the button and the confirm dialog -- because they
   disagreed: the dialog reported the subset and said nothing about an n_tasks
   cap that was shipping alongside it. */
function runPlan(spec) {
  const s = cp.server || {};
  const label = (id) => ((s.harnesses || {})[id] || {}).label || id;
  const ds = (s.datasets || []).find((x) => x.id === spec.dataset);
  return {
    who: spec.harnesses.length
      ? spec.harnesses.map(label).join(", ")
      : `every harness (${Object.keys(s.harnesses || {}).length})`,
    bench: ds ? `${ds.label || ds.id}${ds.tasks ? ` · ${ds.tasks} tasks` : ""}`
      : (spec.dataset || "the catalog default"),
    scope: spec.subset ? `subset “${spec.subset}”`
      : spec.n_tasks ? `the first ${spec.n_tasks} task${spec.n_tasks === 1 ? "" : "s"} (smoke test)`
      : "every task",
    // A blank number box makes num() return null, which used to reach the
    // dialog as the word "null". The catalog default is what actually happens.
    mult: spec.agent_timeout_multiplier == null
      ? "the catalog default" : `${spec.agent_timeout_multiplier}×`,
    model: ((s.config || {}).endpoint || {}).label
      || ((s.config || {}).endpoint || {}).model || "the endpoint's model",
  };
}

function syncRunPlan() {
  const box = $("#run-plan");
  if (!box) return;
  const p = runPlan(runSpecFromForm());
  box.innerHTML =
    `Start will run <b>${esc(p.who)}</b> on <b>${esc(p.bench)}</b>, `
    + `${esc(p.scope)}, against <b>${esc(p.model)}</b> at a ${esc(p.mult)} agent `
    + `timeout.`;
}

/* Which scope controls are live, and which subsets the selected benchmark can
   actually use. Recomputed on every input rather than only at render, because
   changing the benchmark does not redraw this form -- so a subset disabled at
   render time would stay disabled after switching to the benchmark it belongs
   to, and vice versa. */
function syncScope() {
  const mode = (document.querySelector('input[name="run-scope"]:checked') || {}).value
    || "full";
  const dataset = val("run-dataset") || null;
  const sub = $("#run-subset");
  let usable = 0;

  if (sub) {
    Array.from(sub.options).forEach((o) => {
      const owner = o.getAttribute("data-subset-dataset") || "";
      // No declared benchmark means it predates the header and belongs to any
      // of them -- the answer from before this existed, so lists someone
      // already wrote keep working.
      const fits = !owner || !dataset || owner === dataset;
      o.disabled = !fits;
      if (fits && o.value) usable += 1;
    });
    // A selection left pointing at an option that no longer fits would be sent
    // and then refused by the runner, after the images had been pulled.
    const picked = sub.options[sub.selectedIndex];
    if (picked && picked.disabled) {
      const first = Array.from(sub.options).find((o) => !o.disabled && o.value);
      sub.value = first ? first.value : "";
    }
    sub.disabled = mode !== "subset" || !usable;
  }

  const radio = document.querySelector('input[name="run-scope"][value="subset"]');
  if (radio) {
    radio.disabled = !usable;
    if (!usable && mode === "subset") {
      const full = document.querySelector('input[name="run-scope"][value="full"]');
      if (full) full.checked = true;
    }
  }

  const why = $("#run-subset-why");
  if (why) {
    const defined = ((cp.server || {}).subsets || []).length;
    why.textContent = !defined ? "none defined in bench/subsets/ yet"
      : usable ? "task names, so it runs only on the benchmark it came from"
      : "no subset belongs to this benchmark";
  }

  const n = $("#run-ntasks");
  if (n) n.disabled = mode !== "ntasks";

  const full = $("#scope-full-n");
  if (full) {
    const meta = ((cp.server || {}).datasets || []).find((x) => x.id === dataset);
    full.textContent = meta && meta.tasks ? `every task — ${meta.tasks} of them`
      : "every task";
  }
}

function renderLogLines() {
  return cp.log.map((line) => {
    let cls = "";
    if (/^={6,}/.test(line) || /^\s{2}\$ /.test(line)) cls = "rule";
    else if (/\[!\]|error|failed|traceback/i.test(line)) cls = "bad";
    else if (/warn/i.test(line)) cls = "warn";
    return `<span class="ln ${cls}">${esc(line)}</span>`;
  }).join("");
}

/* Whether the *running* server can honour a control, not whether this page
   knows how to draw it. An older server omits the list entirely, which is the
   honest answer for every capability. */
function can(name) {
  const caps = (cp.server || {}).capabilities;
  return Array.isArray(caps) && caps.includes(name);
}

function runSpecFromForm() {
  const picked = Array.from(document.querySelectorAll("[data-harness-pick]"))
    .filter((el) => el.checked)
    .map((el) => el.getAttribute("data-harness-pick"));
  // One scope, taken from the radio rather than from whichever boxes happen to
  // hold a value. Reading both controls independently is what let a run ship a
  // subset *and* an n_tasks cap while the dialog named only the subset.
  const mode = (document.querySelector('input[name="run-scope"]:checked') || {}).value
    || "full";
  const spec = {
    harnesses: picked,
    dataset: val("run-dataset") || null,
    subset: mode === "subset" ? (val("run-subset") || null) : null,
    agent_timeout_multiplier: num("run-mult"),
    n_concurrent: num("run-conc"),
    n_concurrent_agents: num("run-agents"),
    allow_hosts: checked("run-allow-hosts"),
    debug_capture: checked("run-debug"),
  };
  // Sticky across the re-render, so the box does not silently clear itself
  // between reading the hint and pressing start.
  cp.debugCapture = spec.debug_capture;
  if (mode === "ntasks") {
    const n = num("run-ntasks");
    if (n) spec.n_tasks = n;
  }
  return spec;
}

/* The endpoint's real slot count is only known once it has been probed, which
   happens when the run starts -- the runner defaults "generating at once" to it
   and warns on the console. This is the cheap client-side half: the provider's
   own default, which for a self-hosted endpoint is one slot. Advisory only. */
function syncConcurrencyWarning() {
  const box = $("#run-conc-warn");
  if (!box) return;
  const provider = ((cp.server || {}).config || {}).endpoint || {};
  const known = ((cp.server || {}).providers || [])
    .find((p) => p.id === provider.provider);
  const cap = known ? known.default_agent_concurrency : null;
  const agents = num("run-agents");
  const show = cap != null && agents != null && agents > cap;
  box.style.display = show ? "" : "none";
  if (show) {
    box.textContent =
      `${agents} agents will generate at once, but a ${known.label} typically `
      + `serves ${cap}. Past the slot count requests queue at the server, and `
      + `the wait is charged to whichever harness makes more calls — the thing `
      + `you are trying to measure. The exact slot count is checked against `
      + `your endpoint when the run starts.`;
  }
}

function wireRun() {
  // One handler for the whole form rather than one per control: every one of
  // these depends on the others -- the benchmark decides which subsets are
  // usable, the scope decides which boxes are live, and all of them feed the
  // sentence above the button. Wiring them singly is how the benchmark select
  // ended up changing nothing but itself.
  const form = $("#run-plan") && $("#run-plan").closest(".card-body");
  if (form) {
    const sync = () => { syncScope(); syncConcurrencyWarning(); syncRunPlan(); };
    form.oninput = sync;
    form.onchange = sync;
    sync();
  }

  const start = $("#btn-start");
  if (start) start.onclick = () => {
    const spec = runSpecFromForm();
    const p = runPlan(spec);
    if (!confirm(
      `Start a benchmark?\n\n  ${p.who}\n  ${p.bench}\n  ${p.scope}\n`
      + `  ${p.model}\n  agent timeout ${p.mult}\n\n`
      + `This runs Docker containers and can take many hours.`)) return;
    cp.log = [];
    act("run", "start", () => api("/api/run", { method: "POST", body: spec }),
        "Benchmark started.");
  };

  const dry = $("#btn-dry");
  if (dry) dry.onclick = () => {
    cp.log = [];
    act("run", "dry", () => api("/api/run", {
      method: "POST", body: { ...runSpecFromForm(), dry_run: true },
    }), "Preview: the command is shown below, nothing was executed.");
  };

  const stop = $("#btn-stop");
  if (stop) stop.onclick = () => {
    if (!confirm(
      "Stop the running benchmark?\n\n"
      + "Completed trials keep their results and the run is marked stopped. "
      + "The trial in flight is lost, and its task container is removed.")) return;
    act("run", "stop", () => api("/api/run/stop", { method: "POST", body: {} }),
      (r) => {
        // Say how many containers were removed. Killing the process does not
        // stop them, so this is the part a user cannot otherwise verify
        // without going to Docker themselves.
        const n = (r.containers_removed || []).length;
        return n
          ? `Stopped. Removed ${n} task container${n === 1 ? "" : "s"}.`
          : "Stopped. No task containers were left running.";
      });
  };

  const box = $("#run-console");
  if (box) {
    box.scrollTop = cp.logPinned ? box.scrollHeight : box.scrollTop;
    box.onscroll = () => {
      cp.logPinned = box.scrollTop + box.clientHeight >= box.scrollHeight - 24;
    };
  }
}

/* The console's last failure, named, with the steps that fix it.

   A benchmark failure arrives as a stack trace from a subprocess inside a
   container, and the distance between that text and the one-line fix is where
   people give up. Every failure this rig has hit is described once in
   bench/diagnose.py; this shows that description against the console the reader
   is already looking at, rather than making them recognise it themselves.

   Rendered above the console, not inside it: the console is a tail and scrolls
   away, and this is the part worth keeping in view. */
function renderFailure() {
  const parts = [];
  if (cp.failure) parts.push(renderFinding(cp.failure));
  // The trial's own error, when the console could not account for it. Harbor
  // prints that a command failed and what it classified the failure as; the
  // sentence saying why is only ever in the trial's result.json. Shown under
  // its own heading so it is never mistaken for something the console said.
  const tf = cp.trialFailure;
  if (tf && (!cp.failure || (tf.finding && tf.finding.id !== cp.failure.id))) {
    if (tf.finding) parts.push(renderFinding(tf.finding));
    parts.push(`<li class="finding no">
      <span class="mark no">✕</span>
      <span class="what">${esc(tf.trial || "a trial")} failed${
        tf.error_type ? ` — ${esc(tf.error_type)}` : ""}</span>
      <div class="finding-body">
        ${tf.message ? `<pre class="trial-err">${esc(tf.message)}</pre>` : ""}
      </div>
    </li>`);
  }
  if (!parts.length) return "";
  return `<ul class="checklist failure-box">${parts.join("")}</ul>`;
}

/* Ask the server what the console's tail means.

   Keyed on the text so a console that has not changed is not re-sent every
   poll; the tail is what matters because the fatal error is the last thing
   written. Silent on failure and silent when nothing matches -- an unrecognised
   error is left as its own raw text, which the console already shows. */
async function lookupFailure() {
  const tail = cp.log.slice(-200).map((l) => (l && l.text) || l || "").join("\n");
  const key = tail.slice(-4000);
  if (key === cp.failureFrom) return false;
  cp.failureFrom = key;
  const had = cp.failure;
  try {
    const res = await api("/api/explain", { method: "POST", body: { text: key } });
    cp.failure = res.finding || null;
  } catch (_) {
    cp.failure = null;
  }
  return JSON.stringify(had) !== JSON.stringify(cp.failure);
}

/* Update the console and status bar without touching form inputs. */
async function pollRun() {
  if (cp.tab !== "run") return;
  try {
    const data = await api("/api/run/log?limit=600");
    cp.log = data.lines || [];
    const hadTrial = JSON.stringify(cp.trialFailure || null);
    cp.trialFailure = data.trial_failure || null;
    const trialChanged = hadTrial !== JSON.stringify(cp.trialFailure);
    const was = cp.server ? JSON.stringify(cp.server.supervisor) : null;
    if (cp.server) cp.server.supervisor = data.supervisor;
    const box = $("#run-console");
    if (box) {
      box.innerHTML = renderLogLines();
      if (cp.logPinned) box.scrollTop = box.scrollHeight;
    }
    // Repaints its own box rather than the tab: this sits above a console the
    // reader may be scrolled into, and a full re-render would lose that.
    if ((await lookupFailure()) || trialChanged) {
      const slot = $("#run-failure");
      if (slot) slot.innerHTML = renderFailure();
    }
    // A status change alters which buttons exist, so that needs a real render.
    if (was !== JSON.stringify(data.supervisor)) {
      await refreshServerState();
      renderTab("run");
    }
  } catch (_) { /* transient */ }
}

      label: val("hz-label"), agent: val("hz-agent"),
      model_ref: val("hz-model-ref"), vendor: val("hz-vendor"), repo: val("hz-repo"),
    };
    if (kwargs) spec.agent_kwargs = kwargs;
    if (env) spec.agent_env = env;
    act("harnesses", "save", async () => {
      const r = await api("/api/harness", { method: "POST", body: { id, spec } });
      cp.editing = null;
      return r;
    }, `Saved ${id}.`);
  };

  const defs = $("#btn-save-defaults");
  if (defs) defs.onclick = () => act("harnesses", "defaults", () =>
    api("/api/defaults", { method: "POST", body: {
      agent_timeout_multiplier: num("def-mult"),
      n_concurrent: num("def-conc"),
      n_concurrent_agents: num("def-agents"),
      n_attempts: num("def-attempts"),
      environment_build_timeout_multiplier: num("def-envbuild"),
    }}), "Defaults saved.");
}

/* ------------------------------ Maintenance ----------------------------- */

/* Leftover containers and networks, once they have been asked for.

   Both are invisible until they bite, and they bite differently: containers
   hold multiple GB and keep generating against the endpoint, networks cost
   nothing until the subnet pool runs dry and then every task dies with a
   compose error that never says the word "subnet". So the pool line is shown
   whenever it is tight, even with nothing reclaimable. */
function renderOrphans() {
  const o = cp.orphans;
  if (!o) return "";
  const containers = (o.orphaned || []).length;
  const networks = (o.orphaned_networks || []).length;
  const pool = o.network_pool || {};

  // Orphanhood is not readable from a container's name: during a run these are
  // the run's own trials. Calling them leftovers next to a Remove button is how
  // someone kills their own benchmark, so while a run is active they are
  // reported as what they are.
  if (o.run_active) {
    return `<div class="note info" style="margin-top:7px">
      A benchmark is running. ${containers ? `<b>${containers}</b>` : "Its"} task
      container(s) belong to it, not to a previous run &mdash; removing them now
      would kill its trials. Check again once it finishes.</div>`;
  }
  // An older server reports containers only; saying "0 networks" there would
  // be a claim it never made.
  const knowsNetworks = can("orphan_counts") && o.orphaned_networks !== undefined;

  if (!containers && !networks && !pool.tight) {
    return `<div class="note ok" style="margin-top:7px">Nothing left over.${
      knowsNetworks && pool.capacity
        ? ` ${int(pool.n_bridge_networks)} of ~${int(pool.capacity)} bridge networks in use.`
        : ""
    }</div>`;
  }
  const parts = [];
  if (containers) parts.push(`<b>${containers}</b> orphaned container(s)`);
  if (knowsNetworks && networks) parts.push(`<b>${networks}</b> orphaned network(s)`);
  return `<div class="note ${pool.tight ? "bad" : "warn"}" style="margin-top:7px">
    ${parts.join(" and ") || "Nothing reclaimable"}.
    ${knowsNetworks && pool.capacity
      ? `${int(pool.n_bridge_networks)} of ~${int(pool.capacity)} bridge networks in use.`
      : ""}
    ${pool.tight
      ? `<br><b>The subnet pool is nearly exhausted.</b> A run started now will
         fail with compose errors that never mention subnets. Reap before starting.`
      : ""}
  </div>`;
}

/* One diagnostic finding, with what to do about it.

   A check that only says "failed" moves the work to the reader, who then has to
   know the rig well enough to guess -- which is the state this replaced. Every
   non-ok finding carries `fixes`, which are literal next actions in order, so
   the panel renders them as steps rather than prose. `detail` says what was
   observed and why it matters; it is deliberately long, because these failures
   are ones nobody guesses.

   Severities are three, not two: "warn" means the run will start but the result
   is harder to trust (a stale catalog, a disabled path limit), and collapsing
   that into "failed" would either cry wolf or hide it. */
function renderFinding(c) {
  const sev = c.severity || (c.ok ? "ok" : "fail");
  const glyph = { ok: "✓", warn: "!", fail: "✕" }[sev] || "✕";
  const cls = { ok: "ok", warn: "warn", fail: "no" }[sev] || "no";
  if (c.ok) {
    return `<li><span class="mark ok">✓</span>
      <span class="what">${esc(c.title || c.name || "")}</span>
      <span class="detail">${esc(c.detail || "")}</span></li>`;
  }
  const fixes = (c.fixes || []).length
    ? `<ol class="fixes">${c.fixes.map((f) => `<li>${esc(f)}</li>`).join("")}</ol>`
    : "";
  const docs = c.docs
    ? `<div class="fix-docs">More: <code>${esc(c.docs)}</code></div>` : "";
  return `<li class="finding ${cls}">
    <span class="mark ${cls}">${glyph}</span>
    <span class="what">${esc(c.title || c.name || "")}</span>
    <div class="finding-body">
      ${c.detail ? `<p class="finding-detail">${esc(c.detail)}</p>` : ""}
      ${fixes ? `<div class="fix-label">To fix</div>${fixes}` : ""}
      ${docs}
    </div>
  </li>`;
}

function renderMaintenance() {
  const s = cp.server;
  if (!s) return `<div class="empty">Loading&hellip;</div>`;
  const runs = (state.data && state.data.runs) || [];
  const active = s.supervisor.active;

  const doctor = cp.doctor ? `
    <ul class="checklist">
      ${cp.doctor.checks.map((c) => renderFinding(c)).join("")}
    </ul>` : `<p>Checks configuration, Harbor, the Docker daemon, Windows path
       length, catalog freshness, disk headroom and whether the endpoint
       answers. Anything wrong is reported with the steps that fix it.</p>`;

  return `
  ${noticeHtml("maintenance")}
  <div class="card">
    <h2>This instance <span class="sub">which files are actually in play</span></h2>
    <div class="card-body">
      <p class="why">An editable install pins an absolute path at install time, so
        launching from a second clone can silently serve the first one's runs —
        <code>cd</code> does not change how Python resolves imports. These are the
        paths this page is really reading and writing.</p>
      <div class="item">
        <dl>
          <dt>code</dt><dd>${esc(s.code_root || "—")}</dd>
          <dt>config</dt><dd>${esc(s.config_path || "—")}${s.config_exists ? "" : "  (not created yet — using defaults)"}</dd>
          <dt>runs</dt><dd>${esc(s.runs_dir || "—")}</dd>
        </dl>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Health check</h2>
    <div class="card-body">
      ${doctor}
      <div class="btn-row">
        <button class="btn primary" id="btn-doctor" ${cp.busy ? "disabled" : ""}>Run checks</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Task images</h2>
    <div class="card-body">
      <p>Cache images before your first benchmark. Harbor otherwise fetches them
         <em>inside</em> that trial's environment-start budget, and a cold
         multi-GB pull can lose the task outright rather than scoring it.</p>
      <p style="color:var(--ink-muted);font-size:12px">What gets cached depends on
         the benchmark. Terminal-Bench 2 publishes one image per task (~60&nbsp;GB
         for all 89). Aider Polyglot builds each environment locally, so only the
         shared <code>buildpack-deps:jammy</code> base layer is worth pulling &mdash;
         one image for all 225 tasks. A benchmark with neither declared in
         <code>registry.yaml</code> cannot be pre-pulled and will say so.</p>
      <div class="row">
        <div class="field" style="max-width:260px">
          <label for="pre-dataset">Benchmark</label>
          <select id="pre-dataset">
            ${(s.datasets || []).map((d) => {
              const sel = d.id === (s.defaults || {}).dataset ? " selected" : "";
              const how = (d.image_repo && d.image_tag) ? " — per-task images"
                        : (d.base_images || []).length ? " — base image only"
                        : " — not pre-pullable";
              return `<option value="${esc(d.id)}"${sel}>${esc(d.label || d.id)}${how}</option>`;
            }).join("") || `<option value="">catalog default</option>`}
          </select>
        </div>
        <div class="field" style="max-width:260px">
          <label for="pre-subset">Subset</label>
          <select id="pre-subset">
            ${(s.subsets || []).map((n) => `<option value="${esc(n)}">${esc(n)}</option>`).join("")}
            <option value="">full dataset</option>
          </select>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-prepull" ${active || cp.busy ? "disabled" : ""}>Pre-pull images</button>
        ${active ? `<span style="color:var(--ink-muted);font-size:11px">something is already running</span>` : ""}
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Runs on disk <span class="sub">${runs.length} run(s) · ${esc(s.runs_dir)}</span></h2>
    <div class="card-body">
      <p>Run output is large and regenerable. Deleting one removes its trial logs,
         trajectories and results permanently.</p>
      <div class="itemlist">
        ${runs.map((r) => `
          <div class="item">
            <div class="item-head">
              <span class="name">${esc(r.harness_label)}</span>
              <span class="meta">${esc(r.model_label)} · ${r.n_done}/${r.n_total} ·
                ${esc(r.status)} · ${esc(shortTime(r.started_at))}</span>
              <span class="spacer"></span>
              <button class="btn danger" data-del-run="${esc(r.run_id)}"
                ${active || cp.busy ? "disabled" : ""}>Delete</button>
            </div>
          </div>`).join("") || `<div class="note info">No runs yet.</div>`}
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Snapshot and cleanup</h2>
    <div class="card-body">
      <p>A snapshot is a standalone HTML file with the results inlined &mdash; it works
         offline with no server, and carries no control plane. It embeds run
         manifests, so look at what is in one before publishing it.</p>
      <div class="btn-row">
        <button class="btn" id="btn-export" ${cp.busy ? "disabled" : ""}>Export snapshot</button>
        <button class="btn" id="btn-orphans" ${cp.busy ? "disabled" : ""}>Check for leftovers</button>
        <button class="btn danger" id="btn-reap"
          ${active || cp.busy || (cp.orphans && cp.orphans.run_active) ? "disabled" : ""}
          title="${active || (cp.orphans && cp.orphans.run_active)
            ? "A benchmark is running — this would kill its trials" : ""}"
        >Remove orphaned ${
          can("network_reaping") ? "containers and networks" : "containers"
        }</button>
      </div>
      ${renderOrphans()}
      <div class="hint" style="margin-top:7px">A hard-killed run can leave task
        containers running &mdash; one was observed still up six hours later, holding
        multiple GB. Each trial also creates a compose network, and those outlive
        the containers; the pool holds 32, so they run out long before disk does.</div>
    </div>
  </div>`;
}

function wireMaintenance() {
  const doc = $("#btn-doctor");
  if (doc) doc.onclick = () => act("maintenance", "doctor", async () => {
    cp.doctor = await api("/api/doctor");
    return cp.doctor;
  }, (r) => r.ok ? "All checks passed." : "Some checks failed — see below.");

  const orph = $("#btn-orphans");
  if (orph) orph.onclick = () => act("maintenance", "orphans", async () => {
    cp.orphans = await api("/api/containers");
    return cp.orphans;
  }, (r) => {
    const c = (r.orphaned || []).length, n = (r.orphaned_networks || []).length;
    return c || n ? "Found leftovers — see below." : "Nothing left over.";
  });

  const pre = $("#btn-prepull");
  if (pre) pre.onclick = () => {
    if (!confirm("Pre-pull task images?\n\nThis downloads tens of GB and can take a "
      + "long time. Progress appears on the Run tab.")) return;
    cp.log = [];
    act("maintenance", "prepull", () => api("/api/prepull", {
      method: "POST", body: {
        subset: val("pre-subset") || null,
        dataset: val("pre-dataset") || null,
      },
    }), "Pre-pull started — watch progress on the Run tab.");
  };

  document.querySelectorAll("[data-del-run]").forEach((b) => {
    b.onclick = () => {
      const id = b.getAttribute("data-del-run");
      if (!confirm(`Delete run “${id}”?\n\nIts trial logs, trajectories and results `
        + `are removed permanently. This cannot be undone.`)) return;
      act("maintenance", "delrun", async () => {
        const r = await api("/api/runs/" + encodeURIComponent(id), {
          method: "DELETE", body: {},
        });
        // Re-read before act() repaints, exactly as the reap button does: the
        // list below is drawn from state.data, and without this it would keep
        // listing a directory that is no longer on disk.
        await refreshResults();
        return r;
      }, (r) => `Deleted ${id} (${(r.freed_bytes / 1e6).toFixed(0)} MB freed).`);
    };
  });

  const exp = $("#btn-export");
  if (exp) exp.onclick = () => act("maintenance", "export", () =>
    api("/api/export", { method: "POST", body: {} }),
    (r) => `Wrote ${r.wrote} (${(r.bytes / 1024).toFixed(0)} KB).`);

  const reap = $("#btn-reap");
  if (reap) reap.onclick = () => {
    if (!confirm(`Force-remove orphaned Harbor task ${
      can("network_reaping") ? "containers and networks" : "containers"}?\n\n`
      + "Do not do this while a benchmark is running — it would kill its trials.")) return;
    act("maintenance", "reap", async () => {
      const r = await api("/api/containers/reap", { method: "POST", body: {} });
      // Re-read rather than assume: the panel above must not keep asserting
      // leftovers that were just removed, and a failed removal still shows.
      try { cp.orphans = await api("/api/containers"); } catch { cp.orphans = null; }
      return r;
    },
      (r) => {
        // The endpoint reaps both, and networks are the scarcer resource, so
        // reporting only containers made a successful reap look like a no-op.
        const nets = (r.networks && r.networks.removed || []).length;
        if (!r.removed.length && !nets) return "Nothing orphaned to remove.";
        const parts = [];
        if (r.removed.length) parts.push(`${r.removed.length} container(s)`);
        if (nets) parts.push(`${nets} network(s)`);
        return `Removed ${parts.join(" and ")}.`;
      });
  };
}

/* -------------------------------- tabs ---------------------------------- */

const TABS = {
  run: { pane: "pane-run", render: renderRun, wire: wireRun },
  setup: { pane: "pane-setup", render: renderSetup, wire: wireSetup },
  harnesses: { pane: "pane-harnesses", render: renderHarnesses, wire: wireHarnesses },
  maintenance: { pane: "pane-maintenance", render: renderMaintenance, wire: wireMaintenance },
};

function renderTab(name) {
  if (name === "results") { render(); return; }
  const tab = TABS[name];
  if (!tab) return;
  const pane = $("#" + tab.pane);
  if (!pane) return;
  pane.innerHTML = (READONLY
    ? `<div class="readonly-banner">This is an exported snapshot. It has no server
       behind it, so configuring and running are unavailable.</div>`
    : "") + tab.render();
  if (!READONLY) tab.wire();
}

async function selectTab(name) {
  cp.tab = name;
  document.querySelectorAll("#tabs button").forEach((b) => {
    b.setAttribute("aria-selected", String(b.getAttribute("data-tab") === name));
  });
  Object.keys(TABS).forEach((k) => {
    $("#" + TABS[k].pane).classList.toggle("on", k === name);
  });
  $("#pane-results").classList.toggle("on", name === "results");
  document.body.style.overflow = name === "results" ? "" : "auto";

  if (name !== "results" && !READONLY) {
    if (!cp.server) await refreshServerState();
    renderTab(name);
    if (name === "run") pollRun();
  }
}

document.querySelectorAll("#tabs button").forEach((b) => {
  b.onclick = () => selectTab(b.getAttribute("data-tab"));
});

/* A run in flight is worth seeing from any tab. */
function updateRunFlag() {
  const flag = $("#run-flag");
  if (!flag) return;
  const job = cp.server && cp.server.supervisor && cp.server.supervisor.job;
  const active = cp.server && cp.server.supervisor && cp.server.supervisor.active;
  flag.classList.toggle("hidden", !job);
  flag.classList.toggle("live", !!active);
  flag.textContent = job ? (active ? (job.kind === "prepull" ? "pulling" : "running") : job.status) : "";
}

/* -------------------------------- poll ---------------------------------- */

function setLive(on, text) {
  const el = $("#live");
  el.classList.toggle("on", !!on);
  $("#live-text").textContent = text;
}

/* Which runs exist, as one comparable string. Ids only: this decides whether a
   tab has to be repainted, and a run whose task count merely advanced has not
   changed what the upkeep list says. */
function runIdSignature() {
  return ((state.data && state.data.runs) || []).map((r) => r.run_id).join(" ");
}

async function poll() {
  const app = $("#app");
  // Hold the previous render rather than flashing a skeleton -- but only mark
  // it stale if the scan is actually slow. Dimming on every 5s tick would
  // strobe the whole page for a fetch that normally takes milliseconds.
  const slow = setTimeout(() => app.classList.add("stale"), 400);
  try {
    const [res, act] = await Promise.all([
      fetch("/api/results", { cache: "no-store" }),
      // The feed is a nicety; a failure here must not blank the whole page.
      fetch("/api/activity", { cache: "no-store" }).catch(() => null),
    ]);
    if (!res.ok) throw new Error(res.status);
    const before = runIdSignature();
    state.data = await res.json();
    state.activity = act && act.ok ? await act.json() : null;
    const runsChanged = runIdSignature() !== before;
    const running = state.data.summary.n_running;
    setLive(running > 0, running > 0 ? `${running} run${running === 1 ? "" : "s"} in flight` : "idle");
    // Only the visible tab is re-rendered. Repainting a form tab on this tick
    // would discard whatever the user was part-way through typing.
    if (cp.tab === "results") render();
    // The exception, and only when the set of runs actually changed: the upkeep
    // tab lists the run directories on disk, so leaving it alone across a tick
    // that added or removed one shows a run that has finished as still missing,
    // or one just deleted as still present. Gated on the change rather than run
    // every tick for the reason above -- this tab has forms on it too, and five
    // seconds is not long enough to fill one in.
    else if (cp.tab === "maintenance" && runsChanged) renderTab("maintenance");
  } catch (err) {
    setLive(false, "server unreachable");
  } finally {
    clearTimeout(slow);
    app.classList.remove("stale");
  }
}

/* Supervisor state is cheap and drives the tab badge, so it is tracked from
   every tab -- a benchmark you started should be visible wherever you are. */
async function pollSupervisor() {
  if (READONLY) return;
  const before = cp.server && cp.server.supervisor
    ? JSON.stringify(cp.server.supervisor) : null;
  await refreshServerState();
  updateRunFlag();
  const after = cp.server && cp.server.supervisor
    ? JSON.stringify(cp.server.supervisor) : null;
  // Re-render the maintenance tab when a job ends: its buttons are gated on
  // whether anything is running.
  if (before !== after && cp.tab === "maintenance") renderTab("maintenance");
}

/* Which tab to open on.

   Results is the right answer for an installation that has runs, and it is the
   wrong one for every installation that does not: the page is built entirely
   out of runs, so with none it can only render an explanation of itself, and a
   first-time user was being dropped on an empty grid with no indication that
   the two tabs they actually needed were elsewhere. The tab order reads
   Results, Run, Setup -- the reverse of the order you use them in.

   Resolved from state rather than by reordering the tabs, so the page opens on
   the first step that is not done yet: configure the endpoint, start a run,
   read the results. Once there are runs it opens where it always did.

   Only ever applied to the initial load. A landing rule that fired later would
   move the page out from under someone who had deliberately navigated. */
function firstUnfinishedStep() {
  if (((state.data || {}).runs || []).length) return "results";
  // `config_exists` is the file, not a reachable endpoint: it answers "has this
  // been set up", which is the question the Setup tab exists for. A configured
  // rig that is merely down should not send you back to a form you have filled.
  return (cp.server && cp.server.config_exists) ? "run" : "setup";
}

async function landOnTheFirstUnfinishedStep(booted) {
  // After both fetches, or the answer is drawn from state that has not arrived
  // and every fresh load routes to Setup. `booted` is the first poll already in
  // flight rather than a second one: this only has to wait for it.
  await Promise.all([booted, refreshServerState()]);
  const target = firstUnfinishedStep();
  if (target !== "results") selectTab(target);
}

if (window.__HARNESS_ARENA_SNAPSHOT__) {
  // Exported snapshot: data is inlined, there is no server to poll and no
  // control plane to offer, so the tabs that write are removed entirely.
  state.data = window.__HARNESS_ARENA_SNAPSHOT__;
  setLive(false, "snapshot");
  document.querySelectorAll("#tabs button").forEach((b) => {
    if (b.getAttribute("data-tab") !== "results") b.remove();
  });
  render();
} else {
  const booted = poll();
  setInterval(poll, POLL_MS);
  if (!READONLY) {
    pollSupervisor();
    setInterval(pollSupervisor, POLL_MS);
    // The console tails faster than the results scan: it is the only feedback
    // that a run which prints nothing for minutes is still alive.
    setInterval(pollRun, 2000);
    landOnTheFirstUnfinishedStep(booted);
  } else {
    document.querySelectorAll("#tabs button").forEach((b) => {
      if (b.getAttribute("data-tab") !== "results") b.remove();
    });
  }
}

</script>
</body>
</html>
