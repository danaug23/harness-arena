# Harness catalog -- the extension point of this rig.
#
# NEVER put a credential in this file: it is committed. Use {api_key},
# which is resolved at run time and scrubbed out of manifests and logs.
#
# Placeholders: {model_id} {base_url} {base_url_root} {host} {n_ctx}
#               {max_tokens} {label} {api_key}

harnesses:
  hermes:
    label: Hermes Agent
    vendor: Nous Research
    repo: https://github.com/NousResearch/hermes-agent
    agent: harnesses.hermes:Hermes
    model_ref: local/{model_id}
    min_context_window: 64000
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
  minion:
    label: minion
    vendor: Sentdex
    repo: https://github.com/Sentdex/minion
    agent: harnesses.minion:Minion
    model_ref: local/{model_id}
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      max_tokens: '{max_tokens}'
  omp:
    label: oh-my-pi
    vendor: can1357
    repo: https://github.com/can1357/oh-my-pi
    agent: harnesses.omp:Omp
    model_ref: local/{model_id}
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
  claude-code:
    label: Claude Code
    vendor: Anthropic
    repo: https://github.com/anthropics/claude-code
    agent: claude-code
    model_ref: '{model_id}'
    min_context_window: 32768
    host_env:
      ANTHROPIC_BASE_URL: '{base_url_root}'
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '{max_tokens}'
    agent_env:
      ANTHROPIC_API_KEY: '{api_key}'
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: '{n_ctx}'
  codex:
    label: Codex CLI
    vendor: OpenAI
    repo: https://github.com/openai/codex
    agent: harnesses.codex:Codex
    model_ref: '{model_id}'
    agent_env:
      OPENAI_API_KEY: '{api_key}'
    agent_kwargs:
      base_url: '{base_url}'
      context_window: '{n_ctx}'
      wire_api: responses
      reasoning_effort: '{reasoning_effort}'
  opencode:
    label: opencode
    vendor: anomalyco
    repo: https://github.com/anomalyco/opencode
    agent: harnesses.opencode:OpenCode
    model_ref: local/{model_id}
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
allow_agent_hosts:
- downloads.claude.ai
- raw.githubusercontent.com
- github.com
- objects.githubusercontent.com
- api.github.com
- registry.npmjs.org
- nodejs.org
- pypi.org
- files.pythonhosted.org
defaults:
  dataset: terminal-bench@2.0
  n_concurrent: 2
  n_concurrent_agents: 1
  n_attempts: 1
  agent_timeout_multiplier: 8.0
  environment_build_timeout_multiplier: 4.0
