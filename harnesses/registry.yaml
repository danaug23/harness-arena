# Harness catalog -- the extension point of this rig.
#
# NEVER put a credential in this file: it is committed. Use {api_key},
# which is resolved at run time and scrubbed out of manifests and logs.
#
# Placeholders: {model_id} {base_url} {base_url_root} {host} {n_ctx}
#               {max_tokens} {label} {api_key}
#
# `version:` pins the harness build a run installs, and every harness here is
# pinned on purpose. Unpinned, an install resolves whatever upstream's default
# branch holds at the moment each trial starts, which fails two ways: two runs
# a week apart measure different harnesses under one name, and a push *during*
# a run changes the harness between trials of that run. On 2026-08-13
# NousResearch/hermes-agent@6a198f8a1 made a failed `npm install` fatal 2h42m
# into an 89-task run -- the 31 trials before it installed cleanly, 28 of the
# 33 after it died. One run, two harnesses, one number.
#
# The ref is per-installer: git tag (hermes, omp), commit sha (minion), npm
# version (claude-code, codex, dsh), release version (opencode). Bumping one is
# deliberate -- re-run that harness before comparing across the change.
#
# `datasets:` is the benchmark catalog the dashboard offers in its dropdown.
# `id` is passed to `harbor run --dataset` verbatim, so it must be a dataset
# Harbor can resolve -- see hub.harborframework.com/datasets. `tasks` is
# display only. `slug` is the short name that becomes a segment of every run
# directory, so it is bounded at 12 characters: a run directory already carries
# a harness, a model and a timestamp, and Windows still enforces a 260-character
# path limit on the trial directories written underneath it. Omitting it derives
# one from the id, which works but is longer, less recognisable, and a truncation
# -- two ids sharing their first characters derive the same slug, and a catalog
# whose run directories would stop telling two benchmarks apart is refused on
# save whether the collision was written down or derived.
#
# The remaining fields are what pre-pull needs, and which one a dataset uses
# depends on how it ships its environments:
#
#   image_repo/image_tag  the dataset publishes one prebuilt image per task, so
#                         pre-pull fetches <repo>/<task>:<tag> for every task.
#                         Terminal-Bench 2 works this way.
#   base_images           the dataset builds each environment locally from a
#                         Dockerfile, so there is no per-task image to fetch.
#                         What is worth caching is the base layer those
#                         Dockerfiles start FROM. All 225 aider-polyglot tasks
#                         share buildpack-deps:jammy, so one pull covers the
#                         whole dataset.
#
# A dataset with neither can still be benchmarked; it just cannot be pre-pulled,
# and guessing would fetch the wrong images or none at all.
#
# `host_env` is for the benchmarks whose *own* machinery calls a model, rather
# than only the agent under test. Harbor reads a task's [environment].env and
# [verifier].env from its own environment and refuses to start when a required
# one is unset, so without this the run dies before its first trial. The values
# take the same {placeholders} as a harness block and never reach a manifest
# unredacted.
#
# tau3-bench is the case that exists today: its environment simulates the user
# and its verifier judges assertions in natural language, so both need an
# endpoint of their own. Its task.toml defaults both models to gpt-5.2, which
# means pointing only the URL at a local server asks that server for gpt-5.2 --
# so the model names are set too. A run whose user simulator and judge are the
# same small local model is NOT comparable to a published tau3-bench score,
# where both are frontier models; the manifest records what they were.
#
# `{max_tokens}` is the rig's output ceiling, and not every harness has a knob
# to take it. Codex is the one that does not: codex-cli 0.147.0's ConfigToml
# carries 96 keys -- `model_context_window`, `model_auto_compact_token_limit`,
# `tool_output_token_limit` among them -- and none of them caps a completion.
# Checked against the shipped binary, like everything else about Codex here.
#
# A harness that takes no cap runs uncapped, and that is worth knowing rather
# than papering over: on the 20260817 sweep Claude Code's largest completion was
# exactly 16,384 and Codex's was 92,436, and the two tied at 0.68. The manifest
# now records the ceiling only for the harnesses that were actually given one
# (see bench.runner.output_cap_for), and `bench` says so before it starts.
#
# `{reasoning_effort}` is offered to every harness and only some can take it.
# Measured on the current catalog: codex and dsh have a knob, omp has one this
# file does not yet fill (`--thinking`, whose vocabulary differs), and
# claude-code, hermes, minion, dmfa-minion and opencode have none at all. The
# model reasons either way -- it is a reasoning model -- so a harness that is
# told nothing is not a harness that does not think, it is one whose effort
# nobody recorded. The manifest now says per run whether the effort reached the
# harness (`reasoning_effort_applied`), because "told high" and "used its own
# default" are different experiments and used to render identically.
#
# Pairing it with `{max_tokens}` is the combination to think twice about:
# reasoning tokens are billed against the output cap, so a high effort can spend
# the whole budget before the model emits a tool call. The DeepSeek Harness ran
# that way on 2026-08-18 and lost 8 of 25 trials to it -- every one scoring zero,
# three without a single tool call, while the other 17 averaged 0.765. The lever
# for that is the effort *value*, which is one number for the whole sweep and so
# keeps the harnesses comparable; removing the placeholder from one block would
# only hide what that harness then did by default. `bench` warns when a block
# asks for both.
#
# Comments below this line do not survive an edit made from the dashboard:
# that path rewrites the file from parsed YAML and re-emits only this header.

harnesses:
  dmfa-minion:
    label: dmfa-minion
    vendor: danaug23
    repo: https://github.com/danaug23/dmfa-minion
    agent: harnesses.minion:Minion
    model_ref: local/{model_id}
    version: 373df3414c7392307f8eeff7614f438acaf4f272
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      max_tokens: '{max_tokens}'
      repo: https://github.com/danaug23/dmfa-minion
  hermes:
    label: Hermes Agent
    vendor: Nous Research
    repo: https://github.com/NousResearch/hermes-agent
    agent: harnesses.hermes:Hermes
    model_ref: local/{model_id}
    min_context_window: 64000
    version: v2026.8.3
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
      reasoning_effort: '{reasoning_effort}'
  minion:
    label: minion
    vendor: Sentdex
    repo: https://github.com/Sentdex/minion
    agent: harnesses.minion:Minion
    model_ref: local/{model_id}
    version: 900b51d6d2926f2d6ba8c6f3ebd8f8c9eb635b39
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      max_tokens: '{max_tokens}'
  omp:
    label: oh-my-pi
    vendor: can1357
    repo: https://github.com/can1357/oh-my-pi
    agent: harnesses.omp:Omp
    model_ref: local/{model_id}
    version: v17.3.1
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
      reasoning_effort: '{reasoning_effort}'
  claude-code:
    label: Claude Code
    vendor: Anthropic
    repo: https://github.com/anthropics/claude-code
    agent: claude-code
    model_ref: '{model_id}'
    min_context_window: 32768
    version: 2.1.223
    host_env:
      ANTHROPIC_BASE_URL: '{base_url_root}'
      CLAUDE_CODE_MAX_OUTPUT_TOKENS: '{max_tokens}'
    agent_env:
      ANTHROPIC_API_KEY: '{api_key}'
      CLAUDE_CODE_MAX_CONTEXT_TOKENS: '{n_ctx}'
      DISABLE_AUTOUPDATER: '1'
      CLAUDE_CODE_ENABLE_TELEMETRY: '0'
      DISABLE_ERROR_REPORTING: '1'
      OTEL_METRICS_EXPORTER: none
  codex:
    label: Codex CLI
    vendor: OpenAI
    repo: https://github.com/openai/codex
    agent: harnesses.codex:Codex
    model_ref: '{model_id}'
    version: 0.147.0
    agent_env:
      OPENAI_API_KEY: '{api_key}'
    agent_kwargs:
      base_url: '{base_url}'
      context_window: '{n_ctx}'
      wire_api: responses
      reasoning_effort: '{reasoning_effort}'
  dsh:
    label: DeepSeek Harness
    vendor: DeepSeek AI
    repo: https://github.com/deepseek-ai/deepseek-harness
    agent: harnesses.deepseek:DeepSeekHarness
    model_ref: local/{model_id}
    version: 0.1.0-rc.6
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
      reasoning_effort: '{reasoning_effort}'
  opencode:
    label: opencode
    vendor: anomalyco
    repo: https://github.com/anomalyco/opencode
    agent: harnesses.opencode:OpenCode
    model_ref: local/{model_id}
    version: 1.18.18
    agent_kwargs:
      base_url: '{base_url}'
      api_key: '{api_key}'
      context_window: '{n_ctx}'
      max_tokens: '{max_tokens}'
allow_agent_hosts:
- downloads.claude.ai
- raw.githubusercontent.com
- github.com
- objects.githubusercontent.com
- api.github.com
- registry.npmjs.org
- nodejs.org
- pypi.org
- files.pythonhosted.org
datasets:
- id: terminal-bench@2.0
  label: Terminal-Bench 2
  slug: tb2
  tasks: 89
  image_repo: alexgshaw
  image_tag: '20251031'
- id: terminal-bench-pro/terminal-bench-pro
  label: Terminal-Bench Pro
  slug: tbpro
  tasks: 200
- id: aider/aider-polyglot
  label: Aider Polyglot
  slug: polyglot
  tasks: 225
  base_images:
  - buildpack-deps:jammy
- id: swe-bench/swe-bench-verified
  label: SWE-bench Verified
  slug: swebv
  tasks: 500
- id: scale-ai/swe-bench-pro
  label: SWE-bench Pro
  slug: swebpro
  tasks: 731
- id: sierra-research/tau3-bench
  label: tau3-bench
  slug: tau3
  tasks: 375
  host_env:
    OPENAI_API_KEY: '{api_key}'
    OPENAI_BASE_URL: '{base_url}'
    TAU2_USER_MODEL: openai/{model_id}
    TAU2_NL_ASSERTIONS_MODEL: openai/{model_id}
    TAU2_USER_REASONING_EFFORT: ''
- id: gaia/gaia
  label: GAIA
  slug: gaia
  tasks: 165
defaults:
  dataset: terminal-bench@2.0
  n_concurrent: 2
  n_concurrent_agents: 1
  n_attempts: 1
  agent_timeout_multiplier: 8.0
  environment_build_timeout_multiplier: 4.0
